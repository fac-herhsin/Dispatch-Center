<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #000; 
            margin: 0;
            padding: 0;
        }
        
        .login-card {
            background-color: #1a1a1a;
            border-radius: 50px;
            padding: 60px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-btn {
            background-color: #2a2a2a;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 16px;
        }
        
        .login-btn:hover { 
            background-color: #333; 
            transform: translateY(-2px);
        }
        
        .admin-btn {
            background-color: #ffcc00;
            color: #000000;
            font-weight: 900;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .icon-box {
            background-color: #ffcc00;
            width: 100px;
            height: 100px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-item { animation: slideIn 0.3s ease-out forwards; }

        /* 載入中遮罩 */
        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-200">

    <!-- 載入中動畫 -->
    <div id="loading-overlay">
        <div class="w-12 h-12 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-yellow-400 font-bold animate-pulse">正在同步雲端試算表...</p>
    </div>

    <!-- 通知中心 -->
    <div id="toast-container" class="fixed top-6 right-6 z-[300] flex flex-col gap-3 w-72 pointer-events-none"></div>

    <!-- 登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black">
        <div class="login-card text-center">
            <div class="icon-box mb-8">
                <i data-lucide="truck" class="w-14 h-14 text-black"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter mb-2">何鑫 / 薪昌</h1>
            <p class="text-[#ffcc00] font-bold text-sm tracking-[0.4em] uppercase mb-12">載運調度管理系統</p>
            
            <div class="flex flex-col">
                <button onclick="window.login('procure')" class="login-btn">採購/業務部</button>
                <button onclick="window.login('factory')" class="login-btn">廠務調度</button>
                <button onclick="window.login('warehouse')" class="login-btn">倉管部</button>
                <button onclick="window.login('admin')" class="admin-btn">系統管理員</button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-black border-b border-zinc-800 px-8 py-4 flex justify-between items-center z-50">
            <div class="flex items-center space-x-6">
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-black text-white tracking-tight">載運調度管理系統</h2>
                    <div class="flex items-center space-x-2">
                        <span id="user-role-badge" class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-black uppercase tracking-widest">角色</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase" id="current-time-display"></span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="sync-btn" onclick="window.manualSync()" class="flex items-center space-x-2 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-xl text-xs font-bold text-zinc-300 hover:bg-zinc-800">
                    <i id="sync-icon" data-lucide="refresh-cw" class="w-3 h-3"></i>
                    <span>同步雲端</span>
                </button>
                <button id="main-action-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-black flex items-center hidden" onclick="window.openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 新增單據
                </button>
                <button onclick="window.logout()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scroll p-6 bg-[#050505] space-y-8">
            <section class="flex flex-col min-w-0">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-black text-white flex items-center">
                        <span class="w-1.5 h-6 bg-yellow-400 rounded-full mr-3"></span>
                        當前調度清單 <span id="active-count" class="ml-2 text-yellow-400 opacity-60">0</span>
                    </h3>
                </div>
                <div class="bg-zinc-900/50 border border-zinc-800 rounded-[2rem] overflow-hidden flex flex-col">
                    <table class="w-full text-left border-separate border-spacing-0">
                        <thead class="bg-zinc-900 border-b border-zinc-800">
                            <tr class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">
                                <th class="px-6 py-4">單號/類型</th>
                                <th class="px-6 py-4">狀態</th>
                                <th class="px-6 py-4">目的地</th>
                                <th class="px-6 py-4">內容與備註</th>
                                <th class="px-6 py-4">操作</th>
                            </tr>
                        </thead>
                        <tbody id="active-body" class="divide-y divide-zinc-800/50"></tbody>
                    </table>
                </div>
            </section>

            <section class="flex flex-col min-w-0 opacity-80">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-black text-zinc-400 flex items-center">
                        <span class="w-1.5 h-6 bg-zinc-700 rounded-full mr-3"></span>
                        歷史結案紀錄
                    </h3>
                </div>
                <div class="bg-zinc-900/30 border border-zinc-800/50 rounded-[2rem] overflow-hidden flex flex-col">
                    <table class="w-full text-left border-separate border-spacing-0">
                        <thead class="bg-zinc-900/50">
                            <tr class="text-[10px] font-black text-zinc-600 uppercase tracking-widest">
                                <th class="px-6 py-4">單號</th>
                                <th class="px-6 py-4">類型</th>
                                <th class="px-6 py-4">目的地</th>
                                <th class="px-6 py-4">完成時間</th>
                                <th class="px-6 py-4">內容</th>
                                <th class="px-6 py-4">管理</th>
                            </tr>
                        </thead>
                        <tbody id="history-body" class="divide-y divide-zinc-800/30"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 彈窗: 新增單據 -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[2.5rem] max-w-lg w-full p-8 shadow-2xl">
            <h3 class="text-2xl font-black text-white mb-6">新增調度單</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單據類型</label>
                        <select id="input-type" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                            <option value="加工件">加工件</option>
                            <option value="銷售">銷售</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">目的地</label>
                        <input type="text" id="input-vendor" placeholder="工廠或客戶名稱" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">品項名稱</label>
                    <input type="text" id="input-item-name" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">數量</label>
                        <input type="number" id="input-item-qty" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單位</label>
                        <input type="text" id="input-item-unit" value="件" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">備註</label>
                    <textarea id="input-note" rows="2" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none resize-none" placeholder="輸入額外說明..."></textarea>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="window.closeModal()" class="flex-1 py-4 text-zinc-500 font-bold">取消</button>
                <button onclick="window.saveData()" class="flex-1 py-4 bg-yellow-400 text-black font-black rounded-xl">發佈單據</button>
            </div>
        </div>
    </div>

    <script type="module">
    // --- 配置保持不變 ---
    const gasWebappUrl = "https://script.google.com/macros/s/AKfycbx2i6bAtOgzwsxoTRYov93Ao0TWbIekzzNoG2INF-lTrpFx27zLMrMPyE8ycgiROK4tJg/exec"; 
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let db, auth;
    const appId = 'hc-dispatch-v2';
    window.masterData = [];
    window.currentUserRole = null;
    let isInitialized = false; // 新增：判斷是否完成初次讀取

    // 登入邏輯強化
    window.login = async (role) => {
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'flex';

        try {
            window.currentUserRole = role;
            
            // 先確保抓到最新資料才進主畫面
            await forceRefreshData(); 

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            const roles = {'procure':'採購/業務', 'factory':'廠務調度', 'warehouse':'倉管部', 'admin':'系統管理員'};
            document.getElementById('user-role-badge').innerText = roles[role] || role;
            
            const actionBtn = document.getElementById('main-action-btn');
            if (actionBtn) actionBtn.classList.toggle('hidden', !(role === 'procure' || role === 'admin'));

            window.renderTables();
            window.showToast(`歡迎回來，${roles[role]}`, 'success');
        } catch (err) {
            window.showToast('連線失敗，請檢查網路', 'danger');
        } finally {
            loader.style.display = 'none';
        }
    };

    // 強制從 Firebase 抓取最新資料
    async function forceRefreshData() {
        if (!db) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            window.masterData = snap.data().records || [];
            console.log("資料已從雲端恢復:", window.masterData.length, "筆");
        }
    }

    // 保存資料邏輯 (加入存檔檢查)
    window.saveData = async () => {
        // ... 前段獲取 input 值邏輯不變 ...
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'flex';

        const newRecord = {
            id: 'HC-' + Date.now().toString().slice(-6),
            type: document.getElementById('input-type').value,
            status: '待處理',
            vendor: document.getElementById('input-vendor').value,
            items: [{ 
                n: document.getElementById('input-item-name').value, 
                q: document.getElementById('input-item-qty').value, 
                u: document.getElementById('input-item-unit').value 
            }],
            timestamp: Date.now(),
            creator: window.currentUserRole
        };

        try {
            // 1. 先同步 GAS
            await fetch(gasWebappUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "CREATE", ...newRecord }) });

            // 2. 更新本地與 Firebase (關鍵：先抓最新的再存進去，避免覆蓋別人的)
            await forceRefreshData();
            window.masterData = [newRecord, ...window.masterData];
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
            await setDoc(docRef, { records: window.masterData, lastUpdate: Date.now() });

            window.renderTables();
            window.closeModal();
            window.showToast('單據已發佈', 'success');
        } catch (e) {
            window.showToast('存檔失敗', 'danger');
        } finally {
            loader.style.display = 'none';
        }
    };

    // 初始化 Firebase
    async function init() {
        try {
            // 這裡請確保 __firebase_config 有正確帶入
            const config = JSON.parse(document.body.getAttribute('data-fb-config') || '{}'); 
            const app = initializeApp(config);
            auth = getAuth(app);
            db = getFirestore(app);

            await signInAnonymously(auth);
            
            // 設定實時監聽
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    window.masterData = snap.data().records || [];
                    if (window.currentUserRole) window.renderTables();
                }
            });
        } catch (e) { console.error("Init Error", e); }
    }

    window.addEventListener('load', init);
</script>
</body>
</html>
