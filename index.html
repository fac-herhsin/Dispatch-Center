<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0a0a0a; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* 列印專屬樣式 */
        @media print {
            header, .no-print, .action-cell, button, .toast-container { display: none !important; }
            body { background: white; color: black; }
            .print-container { display: block !important; width: 100% !important; }
            table { width: 100% !important; border: 1px solid #000 !important; border-collapse: collapse; }
            th, td { border: 1px solid #000 !important; padding: 8px !important; color: black !important; }
            .status-badge { border: none !important; background: transparent !important; color: black !important; padding: 0 !important; font-weight: bold; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-200">

    <!-- 通知中心 -->
    <div id="toast-container" class="fixed top-6 right-6 z-[300] flex flex-col gap-3 pointer-events-none no-print"></div>

    <!-- 登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[2.5rem] p-10 shadow-2xl w-full max-w-md text-center">
            <div class="bg-yellow-400 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-yellow-400/20">
                <i data-lucide="truck" class="w-10 h-10 text-black"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tighter">何鑫 / 薪昌</h1>
            <p class="text-yellow-400 font-bold text-xs mt-2 tracking-[0.3em] uppercase opacity-80">載運調度管理系統</p>
            
            <div class="mt-10 space-y-3 text-left">
                <button onclick="login('procure')" class="w-full flex items-center justify-between px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition-all group">
                    <span class="font-bold text-zinc-300 group-hover:text-yellow-400 flex items-center"><i data-lucide="shopping-cart" class="w-5 h-5 mr-3"></i>採購/業務部</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
                </button>
                <button onclick="login('factory')" class="w-full flex items-center justify-between px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition-all group">
                    <span class="font-bold text-zinc-300 group-hover:text-yellow-400 flex items-center"><i data-lucide="factory" class="w-5 h-5 mr-3"></i>廠務調度</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
                </button>
                <button onclick="login('warehouse')" class="w-full flex items-center justify-between px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition-all group">
                    <span class="font-bold text-zinc-300 group-hover:text-yellow-400 flex items-center"><i data-lucide="package" class="w-5 h-5 mr-3"></i>倉管部</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
                </button>
                <button onclick="login('admin')" class="w-full py-4 bg-yellow-400 hover:bg-yellow-300 text-black font-black rounded-2xl shadow-xl transition-all flex items-center justify-center">
                    <i data-lucide="shield-check" class="w-5 h-5 mr-2"></i>系統管理員
                </button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-black border-b border-zinc-800 px-8 py-4 flex justify-between items-center z-50">
            <div class="flex items-center space-x-6">
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-black text-white tracking-tight">何鑫/薪昌載運系統</h2>
                    <div class="flex items-center space-x-2">
                        <span id="user-role-badge" class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-black uppercase tracking-widest">角色</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase tracking-tighter" id="current-time-display"></span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 no-print">
                <button id="print-action-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-black flex items-center transition-all shadow-lg shadow-indigo-500/20 hidden" onclick="printSelected()">
                    <i data-lucide="printer" class="w-4 h-4 mr-2"></i> 列印勾選單據
                </button>
                <button id="main-action-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-black flex items-center transition-all shadow-lg shadow-emerald-500/20 hidden" onclick="openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-2"></i> 建立新單據
                </button>
                <div class="h-8 w-[1px] bg-zinc-800 mx-2"></div>
                <button onclick="logout()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- 雙欄看板區 -->
        <main class="flex-1 flex overflow-hidden p-6 gap-6 bg-[#050505]">
            <!-- 左側：進行中 -->
            <section class="flex-1 flex flex-col min-w-0">
                <div class="flex items-center justify-between mb-4 px-2">
                    <div class="flex items-center space-x-3">
                        <div class="w-2 h-8 bg-yellow-400 rounded-full"></div>
                        <h3 class="text-lg font-black text-white tracking-tight uppercase">進行中單據 <span id="active-count" class="ml-2 text-sm text-yellow-400 opacity-60">0</span></h3>
                    </div>
                </div>
                <div class="flex-1 bg-zinc-900/50 border border-yellow-400/10 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
                    <div class="overflow-y-auto custom-scroll flex-1">
                        <table class="w-full text-left border-separate border-spacing-0" id="active-table">
                            <thead class="sticky top-0 bg-zinc-900 border-b border-zinc-800 z-10 shadow-sm">
                                <tr id="active-head" class="text-[10px] font-black text-zinc-500 uppercase tracking-widest"></tr>
                            </thead>
                            <tbody id="active-body" class="divide-y divide-zinc-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 右側：已結案 -->
            <section class="w-1/3 flex flex-col min-w-0 hidden md:flex">
                <div class="flex items-center justify-between mb-4 px-2">
                    <div class="flex items-center space-x-3">
                        <div class="w-2 h-8 bg-zinc-700 rounded-full"></div>
                        <h3 class="text-lg font-black text-zinc-400 tracking-tight uppercase">已結案單據 <span id="closed-count" class="ml-2 text-sm text-zinc-600 italic">0</span></h3>
                    </div>
                </div>
                <div class="flex-1 bg-zinc-950 border border-zinc-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-inner">
                    <div class="overflow-y-auto custom-scroll flex-1">
                        <table class="w-full text-left border-separate border-spacing-0" id="closed-table">
                            <thead class="sticky top-0 bg-zinc-950 border-b border-zinc-900 z-10">
                                <tr id="closed-head" class="text-[10px] font-black text-zinc-600 uppercase tracking-widest"></tr>
                            </thead>
                            <tbody id="closed-body" class="divide-y divide-zinc-900"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal (建立單據) -->
    <div id="modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[3rem] max-w-2xl w-full p-10 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-3xl font-black text-white tracking-tighter">建立調度派車單</h3>
                    <p class="text-xs text-zinc-500 mt-1 font-bold uppercase tracking-widest italic">新增調度派車任務</p>
                </div>
                <button onclick="closeModal()" class="p-2 hover:bg-zinc-800 rounded-full transition-colors"><i data-lucide="x" class="text-zinc-500"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto custom-scroll space-y-6 pr-4">
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest ml-1">單據類型</label>
                        <select id="input-type" class="w-full px-5 py-4 bg-zinc-800 border border-zinc-700 rounded-2xl text-sm font-bold text-yellow-400 outline-none focus:border-yellow-400 transition-all">
                            <option value="加工件">加工件 (需通知收回)</option>
                            <option value="銷售件">銷售件 (直接送達)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest ml-1">目的地廠商/客戶</label>
                        <input type="text" id="input-vendor" placeholder="輸入名稱..." class="w-full px-5 py-4 bg-zinc-800 border border-zinc-700 rounded-2xl text-sm text-white outline-none focus:border-yellow-400 font-bold">
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest ml-1">載運品項清單</label>
                        <button onclick="addItemRow()" class="text-emerald-400 text-[10px] font-black flex items-center bg-emerald-400/10 px-4 py-2 rounded-xl border border-emerald-400/20 hover:bg-emerald-400/20 transition-all"><i data-lucide="plus" class="w-3 h-3 mr-2"></i> 新增項目</button>
                    </div>
                    <div id="items-container" class="space-y-3"></div>
                </div>
            </div>

            <div class="mt-10 pt-8 border-t border-zinc-800 flex gap-4">
                <button onclick="closeModal()" class="flex-1 py-5 text-sm font-black text-zinc-500 hover:text-white transition-colors">取消</button>
                <button onclick="saveData()" class="flex-[2] py-5 bg-yellow-400 hover:bg-yellow-300 text-black text-sm font-black rounded-[1.5rem] shadow-xl shadow-yellow-400/10 transition-all tracking-widest">確認發佈</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let masterData = [
            { id: 'HC-9001', type: '加工件', status: '待處理', vendor: '永成工業', items: [{n:'模具零件', q:'5', u:'組', note:'需研磨'}], time: Date.now() },
            { id: 'HC-9002', type: '銷售件', status: '已結案', vendor: '美利達', items: [{n:'車架組', q:'50', u:'台', note:'趕工'}], time: Date.now() - 5000000 }
        ];

        const COLUMNS = {
            'procure': ['單號', '狀態', '類型', '目的地', '明細', '操作'],
            'factory': ['選取', '單號', '狀態', '目的地', '明細', '操作'],
            'warehouse': ['單號', '狀態', '目的地', '明細', '操作'],
            'admin': ['單號', '狀態', '類型', '目的地', '明細', '操作']
        };

        const STATUS_COLORS = {
            '待處理': 'text-zinc-400 bg-zinc-800 border-zinc-700',
            '配送中': 'text-orange-400 bg-orange-400/10 border-orange-400/30',
            '待通知載回': 'text-indigo-400 bg-indigo-400/10 border-indigo-400/30',
            '待載回': 'text-pink-400 bg-pink-400/10 border-pink-400/30',
            '載回中': 'text-violet-400 bg-violet-400/10 border-violet-400/30',
            '待入庫': 'text-emerald-400 bg-emerald-400/10 border-emerald-400/30',
            '已結案': 'text-zinc-600 bg-transparent border-zinc-800 italic opacity-50'
        };

        function login(role) {
            currentUser = role;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-role-badge').innerText = role === 'admin' ? '系統管理員' : (role === 'procure' ? '採購/業務端' : (role === 'factory' ? '廠務調度' : '倉管收發'));
            document.getElementById('current-time-display').innerText = new Date().toLocaleDateString();
            
            document.getElementById('main-action-btn').classList.toggle('hidden', !(role === 'procure' || role === 'admin'));
            document.getElementById('print-action-btn').classList.toggle('hidden', role !== 'factory');

            renderTables();
            showNotification('登入成功', `歡迎回來，${document.getElementById('user-role-badge').innerText}`);
        }

        function logout() {
            currentUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function renderTables() {
            const activeBody = document.getElementById('active-body');
            const closedBody = document.getElementById('closed-body');
            const activeHead = document.getElementById('active-head');
            const closedHead = document.getElementById('closed-head');
            
            const activeData = masterData.filter(d => d.status !== '已結案');
            const closedData = masterData.filter(d => d.status === '已結案');

            document.getElementById('active-count').innerText = activeData.length;
            document.getElementById('closed-count').innerText = closedData.length;

            const cols = COLUMNS[currentUser];
            activeHead.innerHTML = cols.map(c => `<th class="px-6 py-5">${c}</th>`).join('');
            closedHead.innerHTML = cols.map(c => `<th class="px-6 py-5">${c}</th>`).join('');

            activeBody.innerHTML = activeData.map(item => renderRow(item, cols)).join('');
            closedBody.innerHTML = closedData.map(item => renderRow(item, cols)).join('');
            
            lucide.createIcons();
        }

        function renderRow(item, cols) {
            const itemsList = item.items.map(i => `
                <div class="text-[11px] mb-1 leading-relaxed">
                    <span class="text-zinc-300 font-bold">${i.n}</span> 
                    <span class="text-yellow-400 font-black ml-1">x${i.q}${i.u}</span>
                    ${i.note ? `<span class="text-[9px] text-zinc-500 ml-1 px-1 bg-zinc-950 rounded border border-zinc-800">註: ${i.note}</span>` : ''}
                </div>
            `).join('');

            const statusBadge = `<span class="status-badge px-2.5 py-1 rounded-lg text-[9px] font-black border tracking-wider shadow-sm ${STATUS_COLORS[item.status]}">${item.status}</span>`;
            
            let rowCells = [];
            let actions = [];

            if (currentUser === 'factory') {
                if(item.status === '待處理') actions.push(actionBtn('配送中', 'bg-orange-600', 'truck', item.id));
                if(item.status === '配送中') {
                    const nextStatus = item.type === '加工件' ? '待通知載回' : '已結案';
                    const icon = item.type === '加工件' ? 'arrow-up-right' : 'check-circle';
                    actions.push(actionBtn(nextStatus, 'bg-sky-600', icon, item.id, item.type === '加工件' ? '完成配送 (等通知)' : '完成送貨'));
                }
                if(item.status === '待載回') actions.push(actionBtn('載回中', 'bg-pink-600', 'rotate-ccw', item.id));
                if(item.status === '載回中') actions.push(actionBtn('待入庫', 'bg-emerald-600', 'home', item.id));
            } else if (currentUser === 'procure') {
                if(item.status === '待通知載回' && item.type === '加工件') {
                    actions.push(actionBtn('待載回', 'bg-indigo-600', 'bell', item.id, '通知司機載回'));
                }
            } else if (currentUser === 'admin') {
                // 管理員功能：原本的通知載回
                if(item.status === '待通知載回' && item.type === '加工件') {
                    actions.push(actionBtn('待載回', 'bg-indigo-600', 'bell', item.id, '通知司機載回'));
                }
                // 管理員專屬：刪除按鈕
                actions.push(`<button onclick="deleteItem('${item.id}')" class="bg-red-900/40 hover:bg-red-600 text-red-500 hover:text-white p-2 rounded-xl transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`);
            } else if (currentUser === 'warehouse') {
                if(item.status === '待入庫') actions.push(actionBtn('已結案', 'bg-emerald-700', 'archive', item.id));
            }

            cols.forEach(col => {
                if (col === '單號') rowCells.push(`<span class="font-mono text-xs font-black text-yellow-500/80 tracking-tighter">${item.id}</span>`);
                else if (col === '狀態') rowCells.push(statusBadge);
                else if (col === '目的地') rowCells.push(`<span class="text-xs font-bold text-zinc-100">${item.vendor}</span>`);
                else if (col === '明細') rowCells.push(itemsList);
                else if (col === '類型') rowCells.push(`<span class="text-[10px] text-zinc-600 font-black italic uppercase">${item.type}</span>`);
                else if (col === '操作') rowCells.push(`<div class="flex space-x-2 justify-end items-center">${actions.join('')}</div>`);
                else if (col === '選取') rowCells.push(`<input type="checkbox" value="${item.id}" class="print-checkbox w-4 h-4 rounded-lg border-zinc-700 bg-zinc-800 text-yellow-400 focus:ring-0">`);
            });

            return `<tr class="item-row group hover:bg-zinc-800/20 transition-all" data-id="${item.id}">
                ${rowCells.map(c => `<td class="px-6 py-5 align-top">${c}</td>`).join('')}
            </tr>`;
        }

        function actionBtn(targetStatus, color, icon, id, label = '') {
            return `<button onclick="updateStatus('${id}', '${targetStatus}')" class="${color} text-white px-3 py-2 rounded-xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center space-x-2">
                <i data-lucide="${icon}" class="w-3.5 h-3.5"></i>
                ${label ? `<span class="text-[9px] font-black">${label}</span>` : ''}
            </button>`;
        }

        function deleteItem(id) {
            if(confirm(`確定要刪除單據 ${id} 嗎？此動作無法撤銷。`)) {
                masterData = masterData.filter(d => d.id !== id);
                renderTables();
                showNotification('資料移除', `單據 ${id} 已被永久刪除`);
            }
        }

        function updateStatus(id, status) {
            const item = masterData.find(d => d.id === id);
            if(item) {
                item.status = status;
                renderTables();
                
                let notifyMsg = `單據 ${id} 已更新至 [${status}]`;
                if(status === '待通知載回') notifyMsg = `🚚 加工件 ${id} 已送達廠商，請採購部確認後通知載回`;
                if(status === '待載回') notifyMsg = `🔔 採購已下達指令：請司機安排載回單據 ${id}`;
                if(status === '待入庫') notifyMsg = `📦 單據 ${id} 已返抵公司，請倉管部簽收`;
                
                showNotification('狀態變更', notifyMsg);
            }
        }

        function showNotification(title, msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-yellow-400 text-black px-6 py-4 rounded-2xl shadow-2xl flex items-center space-x-4 pointer-events-auto animate-slide-in min-w-[300px] border border-black/10';
            toast.innerHTML = `
                <div class="bg-black/10 p-2 rounded-xl"><i data-lucide="bell-ring" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-[10px] font-black uppercase opacity-50 tracking-widest">${title}</p>
                    <p class="text-xs font-bold">${msg}</p>
                </div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10', 'transition-all', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        function addItemRow() {
            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 gap-2 items-center bg-zinc-950 p-4 rounded-2xl border border-zinc-800 group animate-in slide-in-from-left duration-300';
            row.innerHTML = `
                <div class="col-span-5"><input type="text" placeholder="品項名稱" class="it-n w-full bg-transparent px-2 py-1 text-xs text-white border-b border-zinc-800 outline-none focus:border-yellow-400"></div>
                <div class="col-span-2"><input type="number" placeholder="數量" class="it-q w-full bg-transparent px-2 py-1 text-xs text-white border-b border-zinc-800 outline-none focus:border-yellow-400 text-center"></div>
                <div class="col-span-2"><input type="text" placeholder="單位" class="it-u w-full bg-transparent px-2 py-1 text-xs text-white border-b border-zinc-800 outline-none focus:border-yellow-400 text-center"></div>
                <div class="col-span-3 flex items-center">
                    <input type="text" placeholder="備註" class="it-note w-full bg-transparent px-2 py-1 text-xs text-zinc-500 border-b border-zinc-800 outline-none">
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-2 text-zinc-700 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `;
            document.getElementById('items-container').appendChild(row);
            lucide.createIcons();
        }

        function saveData() {
            const vendor = document.getElementById('input-vendor').value;
            const rows = document.querySelectorAll('#items-container > div');
            const items = Array.from(rows).map(r => ({
                n: r.querySelector('.it-n').value,
                q: r.querySelector('.it-q').value,
                u: r.querySelector('.it-u').value,
                note: r.querySelector('.it-note').value
            })).filter(i => i.n && i.q);

            if(!vendor || items.length === 0) return alert('請完整填寫單據內容');

            const newId = 'HC-' + Math.floor(1000 + Math.random() * 9000);
            masterData.unshift({
                id: newId,
                type: document.getElementById('input-type').value,
                status: '待處理',
                vendor: vendor,
                items: items,
                time: Date.now()
            });

            closeModal();
            renderTables();
            showNotification('成功建立', `單據 ${newId} 已發佈至調度看板`);
        }

        function printSelected() {
            const checkedIds = Array.from(document.querySelectorAll('.print-checkbox:checked')).map(cb => cb.value);
            if(checkedIds.length === 0) return alert('請先勾選單據');
            const rows = document.querySelectorAll('.item-row');
            rows.forEach(r => {
                if(!checkedIds.includes(r.dataset.id)) r.classList.add('no-print');
                else r.classList.remove('no-print');
            });
            window.print();
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); if(document.getElementById('items-container').children.length === 0) addItemRow(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
