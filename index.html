<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #000; 
            margin: 0;
            padding: 0;
        }
        
        .login-card {
            background-color: #1a1a1a;
            border-radius: 50px;
            padding: 60px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-btn {
            background-color: #2a2a2a;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 16px;
        }
        
        .login-btn:hover { 
            background-color: #333; 
            transform: translateY(-2px);
        }
        
        .admin-btn {
            background-color: #ffcc00;
            color: #000000;
            font-weight: 900;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .icon-box {
            background-color: #ffcc00;
            width: 100px;
            height: 100px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-item { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-200">

    <!-- 通知中心 -->
    <div id="toast-container" class="fixed top-6 right-6 z-[300] flex flex-col gap-3 w-72 pointer-events-none"></div>

    <!-- 登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black">
        <div class="login-card text-center">
            <div class="icon-box mb-8">
                <i data-lucide="truck" class="w-14 h-14 text-black"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter mb-2">何鑫 / 薪昌</h1>
            <p class="text-[#ffcc00] font-bold text-sm tracking-[0.4em] uppercase mb-12">載運調度管理系統</p>
            
            <div class="flex flex-col">
                <button onclick="window.login('procure')" class="login-btn">採購/業務部</button>
                <button onclick="window.login('factory')" class="login-btn">廠務調度</button>
                <button onclick="window.login('warehouse')" class="login-btn">倉管部</button>
                <button onclick="window.login('admin')" class="admin-btn">系統管理員</button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-black border-b border-zinc-800 px-8 py-4 flex justify-between items-center z-50">
            <div class="flex items-center space-x-6">
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-black text-white tracking-tight">載運調度管理系統</h2>
                    <div class="flex items-center space-x-2">
                        <span id="user-role-badge" class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-black uppercase tracking-widest">角色</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase" id="current-time-display"></span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="sync-btn" onclick="window.manualSync()" class="flex items-center space-x-2 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-xl text-xs font-bold text-zinc-300 hover:bg-zinc-800">
                    <i id="sync-icon" data-lucide="refresh-cw" class="w-3 h-3"></i>
                    <span>同步雲端</span>
                </button>
                <button id="main-action-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-black flex items-center hidden" onclick="window.openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 新增單據
                </button>
                <button onclick="window.logout()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scroll p-6 bg-[#050505] space-y-8">
            <!-- 當前調度清單 -->
            <section class="flex flex-col min-w-0">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-black text-white flex items-center">
                        <span class="w-1.5 h-6 bg-yellow-400 rounded-full mr-3"></span>
                        當前調度清單 <span id="active-count" class="ml-2 text-yellow-400 opacity-60">0</span>
                    </h3>
                </div>
                <div class="bg-zinc-900/50 border border-zinc-800 rounded-[2rem] overflow-hidden flex flex-col">
                    <table class="w-full text-left border-separate border-spacing-0">
                        <thead class="bg-zinc-900 border-b border-zinc-800">
                            <tr class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">
                                <th class="px-6 py-4">單號/類型</th>
                                <th class="px-6 py-4">狀態</th>
                                <th class="px-6 py-4">目的地</th>
                                <th class="px-6 py-4">內容與備註</th>
                                <th class="px-6 py-4">操作</th>
                            </tr>
                        </thead>
                        <tbody id="active-body" class="divide-y divide-zinc-800/50"></tbody>
                    </table>
                </div>
            </section>

            <!-- 歷史結案清單 -->
            <section class="flex flex-col min-w-0 opacity-80">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-black text-zinc-400 flex items-center">
                        <span class="w-1.5 h-6 bg-zinc-700 rounded-full mr-3"></span>
                        歷史結案紀錄
                    </h3>
                </div>
                <div class="bg-zinc-900/30 border border-zinc-800/50 rounded-[2rem] overflow-hidden flex flex-col">
                    <table class="w-full text-left border-separate border-spacing-0">
                        <thead class="bg-zinc-900/50">
                            <tr class="text-[10px] font-black text-zinc-600 uppercase tracking-widest">
                                <th class="px-6 py-4">單號</th>
                                <th class="px-6 py-4">類型</th>
                                <th class="px-6 py-4">目的地</th>
                                <th class="px-6 py-4">完成時間</th>
                                <th class="px-6 py-4">內容</th>
                                <th class="px-6 py-4">管理</th>
                            </tr>
                        </thead>
                        <tbody id="history-body" class="divide-y divide-zinc-800/30"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 彈窗: 新增單據 -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[2.5rem] max-w-lg w-full p-8 shadow-2xl">
            <h3 class="text-2xl font-black text-white mb-6">新增調度單</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單據類型</label>
                        <select id="input-type" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                            <option value="加工件">加工件</option>
                            <option value="銷售">銷售</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">目的地</label>
                        <input type="text" id="input-vendor" placeholder="工廠或客戶名稱" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">品項名稱</label>
                    <input type="text" id="input-item-name" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">數量</label>
                        <input type="number" id="input-item-qty" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單位</label>
                        <input type="text" id="input-item-unit" value="件" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">備註</label>
                    <textarea id="input-note" rows="2" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none resize-none" placeholder="輸入額外說明..."></textarea>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="window.closeModal()" class="flex-1 py-4 text-zinc-500 font-bold">取消</button>
                <button onclick="window.saveData()" class="flex-1 py-4 bg-yellow-400 text-black font-black rounded-xl">發佈單據</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- 設定區塊 ---
        // 請在此處填入您部署後的 Google Apps Script 網頁應用程式 URL
        const gasWebappUrl = "https://script.google.com/macros/s/AKfycbx2i6bAtOgzwsxoTRYov93Ao0TWbIekzzNoG2INF-lTrpFx27zLMrMPyE8ycgiROK4tJg/exec"; 
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db, auth, userAuth;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hc-dispatch-v2';
        window.masterData = [];
        window.currentUserRole = null;
        let isSyncing = false;

        window.showToast = (msg, type = 'info') => {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : (type === 'warning' ? 'bg-orange-600' : (type === 'danger' ? 'bg-red-600' : 'bg-zinc-800'));
            toast.className = `toast-item ${bg} text-white p-4 rounded-2xl shadow-xl flex items-center space-x-3 pointer-events-auto mb-2 transition-opacity duration-300`;
            toast.innerHTML = `<i data-lucide="bell" class="w-4 h-4"></i><span class="text-xs font-bold">${msg}</span>`;
            container.appendChild(toast);
            if (window.lucide) window.lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        };

        // 新增功能：同步資料至 Google 試算表
        window.syncToSheet = async (record) => {
            if (!gasWebappUrl || gasWebappUrl.includes("您的ID")) return;
            
            try {
                const itemDetails = record.items.map(i => `${i.n} x${i.q}${i.u}`).join(', ');
                const payload = {
                    id: record.id,
                    type: record.type,
                    status: record.status,
                    vendor: record.vendor,
                    items: itemDetails,
                    note: record.note || '',
                    timestamp: new Date(record.timestamp).toLocaleString('zh-TW'),
                    completedAt: record.completedAt ? new Date(record.completedAt).toLocaleString('zh-TW') : ''
                };

                // 使用 fetch 發送 POST 請求
                await fetch(gasWebappUrl, {
                    method: 'POST',
                    mode: 'no-cors', // 重要：避免跨域問題
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.log("試算表同步指令已發送");
            } catch (e) {
                console.error("試算表同步失敗:", e);
            }
        };

        window.login = (role) => {
            window.currentUserRole = role;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            const roles = {'procure':'採購/業務', 'factory':'廠務調度', 'warehouse':'倉管部', 'admin':'系統管理員'};
            document.getElementById('user-role-badge').innerText = roles[role] || role;
            document.getElementById('current-time-display').innerText = new Date().toLocaleDateString();
            document.getElementById('main-action-btn').classList.toggle('hidden', !(role === 'procure' || role === 'admin'));
            window.renderTables();
            window.showToast(`歡迎回來，${roles[role]}`, 'success');
        };

        window.logout = () => {
            window.currentUserRole = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        window.openModal = () => document.getElementById('modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.saveData = async () => {
            const type = document.getElementById('input-type').value;
            const vendor = document.getElementById('input-vendor').value;
            const name = document.getElementById('input-item-name').value;
            const qty = document.getElementById('input-item-qty').value;
            const unit = document.getElementById('input-item-unit').value;
            const note = document.getElementById('input-note').value;

            if(!vendor || !name || !qty) {
                window.showToast('請填寫完整資訊', 'warning');
                return;
            }

            const newRecord = {
                id: 'HC-' + Date.now().toString().slice(-6),
                type,
                status: '待處理',
                vendor,
                note,
                items: [{ n: name, q: qty, u: unit }],
                timestamp: Date.now(),
                completedAt: null
            };

            window.masterData = [newRecord, ...window.masterData];
            window.renderTables();
            window.closeModal();
            window.showToast(`單據 ${newRecord.id} 已建立`, 'info');
            
            await window.manualSync(true);
            window.syncToSheet(newRecord); // 同步到試算表
            
            document.getElementById('input-vendor').value = '';
            document.getElementById('input-item-name').value = '';
            document.getElementById('input-item-qty').value = '';
            document.getElementById('input-note').value = '';
        };

        window.updateStatus = async (id, newStatus) => {
            const index = window.masterData.findIndex(d => d.id === id);
            if (index === -1) return;

            const record = window.masterData[index];
            let finalStatus = newStatus;
            
            if (newStatus === '已送達') {
                if (record.type === '加工件') {
                    finalStatus = '待採購確認';
                } else {
                    finalStatus = '已結案';
                    window.masterData[index].completedAt = Date.now();
                }
            } else if (newStatus === '已結案') {
                window.masterData[index].completedAt = Date.now();
            }

            window.masterData[index].status = finalStatus;
            window.renderTables();
            window.showToast(`狀態更新為 ${finalStatus}`, 'success');
            
            await window.manualSync(true);
            window.syncToSheet(window.masterData[index]); // 更新狀態時同步到試算表
        };

        window.deleteRecord = async (id) => {
            const index = window.masterData.findIndex(d => d.id === id);
            if (index === -1) return;
            window.masterData.splice(index, 1);
            window.renderTables();
            window.showToast(`單據 ${id} 已刪除`, 'danger');
            await window.manualSync(true);
        };

        window.manualSync = async (isAuto = false) => {
            if (isSyncing) return;
            const btn = document.getElementById('sync-btn');
            const icon = document.getElementById('sync-icon');
            isSyncing = true;
            if (btn && icon) { btn.disabled = true; icon.classList.add('animate-spin'); }

            if (!db) { isSyncing = false; return; }

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
                await setDoc(docRef, { records: window.masterData, lastUpdate: Date.now() });
                if (!isAuto) window.showToast('同步成功！', 'success');
            } catch (e) {
                window.showToast('同步失敗', 'warning');
            } finally {
                isSyncing = false;
                if (btn && icon) { btn.disabled = false; icon.classList.remove('animate-spin'); }
            }
        };

        window.renderTables = () => {
            const body = document.getElementById('active-body');
            const historyBody = document.getElementById('history-body');
            if (!body || !historyBody) return;

            const activeRecords = window.masterData.filter(d => d.status !== '已結案');
            document.getElementById('active-count').innerText = activeRecords.length;

            body.innerHTML = activeRecords.map(item => {
                const itemStr = item.items.map(i => `<span class="text-zinc-300 font-bold">${i.n}</span> <span class="text-yellow-400">x${i.q}${i.u}</span>`).join('<br>');
                const noteStr = item.note ? `<div class="mt-2 text-[10px] text-zinc-500 italic border-l-2 border-zinc-700 pl-2">備註: ${item.note}</div>` : '';
                
                let actionBtn = '';
                const role = window.currentUserRole;

                if (role === 'factory') {
                    if (item.status === '待處理') actionBtn = `<button onclick="window.updateStatus('${item.id}', '配送中')" class="bg-orange-600 px-4 py-2 rounded-xl text-[10px] font-black">開始配送</button>`;
                    else if (item.status === '配送中') actionBtn = `<button onclick="window.updateStatus('${item.id}', '已送達')" class="bg-emerald-600 px-4 py-2 rounded-xl text-[10px] font-black">標記送達</button>`;
                    else if (item.status === '待載回') actionBtn = `<button onclick="window.updateStatus('${item.id}', '已結案')" class="bg-blue-600 px-4 py-2 rounded-xl text-[10px] font-black">已載回結案</button>`;
                } else if (role === 'procure' && item.status === '待採購確認') {
                    actionBtn = `<button onclick="window.updateStatus('${item.id}', '待載回')" class="bg-yellow-500 text-black px-4 py-2 rounded-xl text-[10px] font-black animate-pulse">確認載回</button>`;
                }
                
                if (role === 'admin') {
                    actionBtn = `<button onclick="window.updateStatus('${item.id}', '已結案')" class="text-zinc-500 hover:text-emerald-400 text-[10px] underline mr-2">結案</button><button onclick="window.deleteRecord('${item.id}')" class="p-2 text-zinc-600 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                }

                let statusClass = 'text-zinc-400 border-zinc-700';
                if (item.status === '待採購確認') statusClass = 'text-orange-400 border-orange-700 bg-orange-900/20';
                if (item.status === '待載回') statusClass = 'text-yellow-400 border-yellow-700 bg-yellow-900/20';

                return `<tr class="hover:bg-zinc-900/40 transition-colors">
                    <td class="px-6 py-6"><div class="font-mono text-yellow-500 font-black">${item.id}</div><div class="text-[9px] text-zinc-600 font-bold uppercase mt-1">${item.type}</div></td>
                    <td class="px-6 py-6"><span class="px-3 py-1 rounded-full bg-zinc-800 text-[10px] font-black border ${statusClass}">${item.status}</span></td>
                    <td class="px-6 py-6 font-bold text-white">${item.vendor}</td>
                    <td class="px-6 py-6"><div>${itemStr}</div>${noteStr}</td>
                    <td class="px-6 py-6">${actionBtn}</td>
                </tr>`;
            }).join('');

            const historyRecords = window.masterData.filter(d => d.status === '已結案').sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
            historyBody.innerHTML = historyRecords.map(item => `
                <tr class="text-zinc-500 text-xs">
                    <td class="px-6 py-4 font-mono font-bold">${item.id}</td>
                    <td class="px-6 py-4">${item.type}</td>
                    <td class="px-6 py-4 font-bold text-zinc-400">${item.vendor}</td>
                    <td class="px-6 py-4 text-[10px]">${item.completedAt ? new Date(item.completedAt).toLocaleString() : '-'}</td>
                    <td class="px-6 py-4 truncate max-w-xs">${item.items.map(i => `${i.n} x${i.q}${i.u}`).join(', ')}</td>
                    <td class="px-6 py-4">${window.currentUserRole === 'admin' ? `<button onclick="window.deleteRecord('${item.id}')" class="text-zinc-600 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : '-'}</td>
                </tr>`).join('');

            if (window.lucide) window.lucide.createIcons();
        };

        async function initializeSystem() {
            try {
                if (typeof __firebase_config === 'undefined') return;
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    userAuth = user;
                    if (user) {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
                        onSnapshot(docRef, (snap) => {
                            if (snap.exists() && !isSyncing) {
                                window.masterData = snap.data().records || [];
                                if (window.currentUserRole) window.renderTables();
                            }
                        });
                    }
                });
            } catch (err) { console.error(err); }
        }

        window.addEventListener('load', () => {
            initializeSystem();
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
