<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #000; 
            margin: 0;
            padding: 0;
        }
        
        /* 參照圖片修正登入卡片樣式 */
        .login-card {
            background-color: #1a1a1a;
            border-radius: 50px;
            padding: 60px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-btn {
            background-color: #2a2a2a;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 16px;
        }
        
        .login-btn:hover { 
            background-color: #333; 
            transform: translateY(-2px);
        }
        
        .admin-btn {
            background-color: #ffcc00;
            color: #000000;
            font-weight: 900;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .admin-btn:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
        }

        .icon-box {
            background-color: #ffcc00;
            width: 100px;
            height: 100px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
            box-shadow: 0 10px 30px rgba(255, 204, 0, 0.3);
        }

        /* 滾動條美化 */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* 動畫 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        
        .sync-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-200">

    <div id="toast-container" class="fixed top-6 right-6 z-[300] flex flex-col gap-3 pointer-events-none"></div>

    <!-- 登入頁面 (UI 完全參照截圖) -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black">
        <div class="login-card text-center animate-fade-in">
            <div class="icon-box">
                <i data-lucide="truck" class="w-14 h-14 text-black"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter mb-2">何鑫 / 薪昌</h1>
            <p class="text-[#ffcc00] font-bold text-sm tracking-[0.4em] uppercase mb-12">載運調度管理系統</p>
            
            <div class="flex flex-col">
                <button onclick="window.login('procure')" class="login-btn">
                    採購/業務部
                </button>
                <button onclick="window.login('factory')" class="login-btn">
                    廠務調度
                </button>
                <button onclick="window.login('warehouse')" class="login-btn">
                    倉管部
                </button>
                <button onclick="window.login('admin')" class="admin-btn">
                    系統管理員
                </button>
            </div>
        </div>
    </div>

    <!-- 主頁面 (登入後顯示) -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-black border-b border-zinc-800 px-8 py-4 flex justify-between items-center z-50">
            <div class="flex items-center space-x-6">
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-black text-white tracking-tight">載運調度管理系統</h2>
                    <div class="flex items-center space-x-2">
                        <span id="user-role-badge" class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-black uppercase tracking-widest">角色</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase" id="current-time-display"></span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <div id="sync-status" class="flex items-center space-x-2 px-3 py-1.5 bg-zinc-900 rounded-lg text-[10px] font-bold text-zinc-500">
                    <i id="sync-icon" data-lucide="cloud" class="w-3 h-3"></i>
                    <span id="sync-text">載入中</span>
                </div>
                <button id="main-action-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-black flex items-center hidden" onclick="window.openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 新增單據
                </button>
                <button onclick="window.logout()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 flex overflow-hidden p-6 gap-6 bg-[#050505]">
            <!-- 進行中列表 -->
            <section class="flex-1 flex flex-col min-w-0">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-black text-white flex items-center">
                        <span class="w-1.5 h-6 bg-yellow-400 rounded-full mr-3"></span>
                        進行中單據 <span id="active-count" class="ml-2 text-yellow-400 opacity-60">0</span>
                    </h3>
                </div>
                <div class="flex-1 bg-zinc-900/50 border border-zinc-800 rounded-[2rem] overflow-hidden flex flex-col">
                    <div class="overflow-y-auto custom-scroll flex-1">
                        <table class="w-full text-left border-separate border-spacing-0">
                            <thead class="sticky top-0 bg-zinc-900 border-b border-zinc-800 z-10">
                                <tr class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">
                                    <th class="px-6 py-4">單號</th>
                                    <th class="px-6 py-4">狀態</th>
                                    <th class="px-6 py-4">目的地</th>
                                    <th class="px-6 py-4">內容</th>
                                    <th class="px-6 py-4">操作</th>
                                </tr>
                            </thead>
                            <tbody id="active-body" class="divide-y divide-zinc-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 彈窗 (新增單據) -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[2.5rem] max-w-lg w-full p-8 shadow-2xl">
            <h3 class="text-2xl font-black text-white mb-6">新增調度單</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">目的地</label>
                    <input type="text" id="input-vendor" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">品項名稱</label>
                    <input type="text" id="input-item-name" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">數量</label>
                        <input type="number" id="input-item-qty" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單位</label>
                        <input type="text" id="input-item-unit" value="件" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="window.closeModal()" class="flex-1 py-4 text-zinc-500 font-bold">取消</button>
                <button onclick="window.saveData()" class="flex-1 py-4 bg-yellow-400 text-black font-black rounded-xl">發佈</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 全域狀態與配置
        let db, auth;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hc-dispatch-v2';
        let userAuth = null;
        window.masterData = [];
        window.currentUserRole = null;

        // 頁面行為邏輯
        window.login = (role) => {
            window.currentUserRole = role;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            const roles = {'procure':'採購/業務', 'factory':'廠務調度', 'warehouse':'倉管部', 'admin':'系統管理員'};
            document.getElementById('user-role-badge').innerText = roles[role] || role;
            document.getElementById('current-time-display').innerText = new Date().toLocaleDateString();
            document.getElementById('main-action-btn').classList.toggle('hidden', !(role === 'procure' || role === 'admin'));
            
            window.renderTables();
            if (window.lucide) window.lucide.createIcons();
        };

        window.logout = () => {
            window.currentUserRole = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        window.openModal = () => document.getElementById('modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.saveData = async () => {
            const vendor = document.getElementById('input-vendor').value;
            const name = document.getElementById('input-item-name').value;
            const qty = document.getElementById('input-item-qty').value;
            const unit = document.getElementById('input-item-unit').value;

            if(!vendor || !name || !qty) return;

            const newRecord = {
                id: 'HC-' + Math.floor(Math.random() * 9000 + 1000),
                status: '待處理',
                vendor,
                items: [{ n: name, q: qty, u: unit }],
                timestamp: Date.now()
            };

            window.masterData.unshift(newRecord);
            window.closeModal();
            
            document.getElementById('input-vendor').value = '';
            document.getElementById('input-item-name').value = '';
            document.getElementById('input-item-qty').value = '';

            await syncToCloud();
        };

        window.updateStatus = async (id, newStatus) => {
            const index = window.masterData.findIndex(d => d.id === id);
            if (index !== -1) {
                window.masterData[index].status = newStatus;
                await syncToCloud();
            }
        };

        window.renderTables = () => {
            const body = document.getElementById('active-body');
            if (!body) return;

            const activeRecords = window.masterData.filter(d => d.status !== '已結案');
            document.getElementById('active-count').innerText = activeRecords.length;

            body.innerHTML = activeRecords.map(item => {
                const itemStr = item.items.map(i => `<span class="text-zinc-300 font-bold">${i.n}</span> <span class="text-yellow-400">x${i.q}${i.u}</span>`).join('<br>');
                
                let actionBtn = '';
                if (window.currentUserRole === 'factory' && item.status === '待處理') {
                    actionBtn = `<button onclick="window.updateStatus('${item.id}', '配送中')" class="bg-orange-600 px-3 py-1.5 rounded-lg text-[10px] font-bold">開始配送</button>`;
                } else if (window.currentUserRole === 'factory' && item.status === '配送中') {
                    actionBtn = `<button onclick="window.updateStatus('${item.id}', '已結案')" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-[10px] font-bold">完成送達</button>`;
                }

                return `<tr>
                    <td class="px-6 py-4 font-mono text-yellow-500 font-bold">${item.id}</td>
                    <td class="px-6 py-4"><span class="px-2 py-0.5 rounded bg-zinc-800 text-[10px] border border-zinc-700">${item.status}</span></td>
                    <td class="px-6 py-4 font-bold">${item.vendor}</td>
                    <td class="px-6 py-4">${itemStr}</td>
                    <td class="px-6 py-4">${actionBtn}</td>
                </tr>`;
            }).join('');

            if (window.lucide) window.lucide.createIcons();
        };

        async function syncToCloud() {
            if (!userAuth || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
            try {
                await setDoc(docRef, { records: window.masterData, lastUpdate: Date.now() });
                updateSyncUI('connected');
            } catch (e) {
                console.error("Sync error:", e);
                updateSyncUI('error');
            }
        }

        function updateSyncUI(status) {
            const icon = document.getElementById('sync-icon');
            const text = document.getElementById('sync-text');
            if (!icon || !text) return;

            if (status === 'connected') {
                icon.setAttribute('data-lucide', 'cloud-check');
                text.innerText = '雲端連線中';
                text.className = 'text-emerald-500';
            } else if (status === 'error') {
                icon.setAttribute('data-lucide', 'cloud-off');
                text.innerText = '離線模式';
                text.className = 'text-red-500';
            }
            if (window.lucide) window.lucide.createIcons();
        }

        // 初始化 Firebase
        async function initializeSystem() {
            try {
                // 檢查是否有配置資訊
                if (typeof __firebase_config === 'undefined') {
                    console.warn("Firebase config not found, running in local mode.");
                    updateSyncUI('error');
                    return;
                }

                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // 身份驗證流程
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => {
                    userAuth = user;
                    if (user) {
                        updateSyncUI('connected');
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', 'master');
                        onSnapshot(docRef, (snap) => {
                            if (snap.exists()) {
                                window.masterData = snap.data().records || [];
                                if (window.currentUserRole) window.renderTables();
                            }
                        }, (err) => console.error("Snapshot error:", err));
                    }
                });
            } catch (err) {
                console.error("System init error:", err);
                updateSyncUI('error');
            }
        }

        // 確保 DOM 載入後執行
        window.addEventListener('load', () => {
            initializeSystem();
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
