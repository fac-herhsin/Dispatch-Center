<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0a0a0a; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        @media print {
            header, .no-print, .action-cell, button, .toast-container { display: none !important; }
            body { background: white; color: black; }
            .print-container { display: block !important; width: 100% !important; }
            table { width: 100% !important; border: 1px solid #000 !important; border-collapse: collapse; }
            th, td { border: 1px solid #000 !important; padding: 8px !important; color: black !important; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        
        .sync-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-200">

    <div id="toast-container" class="fixed top-6 right-6 z-[300] flex flex-col gap-3 pointer-events-none no-print"></div>

    <!-- 登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[2.5rem] p-10 shadow-2xl w-full max-w-md text-center">
            <div class="bg-yellow-400 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-yellow-400/20">
                <i data-lucide="truck" class="w-10 h-10 text-black"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tighter">何鑫 / 薪昌</h1>
            <p class="text-yellow-400 font-bold text-xs mt-2 tracking-[0.3em] uppercase opacity-80">載運調度管理系統</p>
            
            <div class="mt-10 space-y-3 text-left">
                <button onclick="window.login('procure')" class="w-full flex items-center justify-between px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition-all group">
                    <span class="font-bold text-zinc-300 group-hover:text-yellow-400 flex items-center"><i data-lucide="shopping-cart" class="w-5 h-5 mr-3"></i>採購/業務部</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
                </button>
                <button onclick="window.login('factory')" class="w-full flex items-center justify-between px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition-all group">
                    <span class="font-bold text-zinc-300 group-hover:text-yellow-400 flex items-center"><i data-lucide="factory" class="w-5 h-5 mr-3"></i>廠務調度</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
                </button>
                <button onclick="window.login('warehouse')" class="w-full flex items-center justify-between px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition-all group">
                    <span class="font-bold text-zinc-300 group-hover:text-yellow-400 flex items-center"><i data-lucide="package" class="w-5 h-5 mr-3"></i>倉管部</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
                </button>
                <button onclick="window.login('admin')" class="w-full py-4 bg-yellow-400 hover:bg-yellow-300 text-black font-black rounded-2xl shadow-xl transition-all flex items-center justify-center">
                    <i data-lucide="shield-check" class="w-5 h-5 mr-2"></i>系統管理員
                </button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-black border-b border-zinc-800 px-8 py-4 flex justify-between items-center z-50">
            <div class="flex items-center space-x-6">
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-black text-white tracking-tight">何鑫/薪昌載運系統</h2>
                    <div class="flex items-center space-x-2">
                        <span id="user-role-badge" class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-black uppercase tracking-widest">角色</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase tracking-tighter" id="current-time-display"></span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 no-print">
                <button id="sync-btn" class="flex items-center space-x-2 px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-xl text-[10px] font-black hover:bg-zinc-800 transition-all text-zinc-400">
                    <i id="sync-icon" data-lucide="cloud-off" class="w-3.5 h-3.5"></i>
                    <span id="sync-text">載入中...</span>
                </button>

                <button id="main-action-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-black flex items-center transition-all shadow-lg shadow-emerald-500/20 hidden" onclick="window.openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-2"></i> 建立新單據
                </button>
                <div class="h-8 w-[1px] bg-zinc-800 mx-2"></div>
                <button onclick="window.logout()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 flex overflow-hidden p-6 gap-6 bg-[#050505]">
            <section class="flex-1 flex flex-col min-w-0">
                <div class="flex items-center justify-between mb-4 px-2">
                    <div class="flex items-center space-x-3">
                        <div class="w-2 h-8 bg-yellow-400 rounded-full"></div>
                        <h3 class="text-lg font-black text-white tracking-tight uppercase">進行中單據 <span id="active-count" class="ml-2 text-sm text-yellow-400 opacity-60">0</span></h3>
                    </div>
                </div>
                <div class="flex-1 bg-zinc-900/50 border border-yellow-400/10 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
                    <div class="overflow-y-auto custom-scroll flex-1">
                        <table class="w-full text-left border-separate border-spacing-0" id="active-table">
                            <thead class="sticky top-0 bg-zinc-900 border-b border-zinc-800 z-10 shadow-sm">
                                <tr id="active-head" class="text-[10px] font-black text-zinc-500 uppercase tracking-widest"></tr>
                            </thead>
                            <tbody id="active-body" class="divide-y divide-zinc-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="w-1/3 flex flex-col min-w-0 hidden md:flex">
                <div class="flex items-center justify-between mb-4 px-2">
                    <div class="flex items-center space-x-3">
                        <div class="w-2 h-8 bg-zinc-700 rounded-full"></div>
                        <h3 class="text-lg font-black text-zinc-400 tracking-tight uppercase">已結案單據 <span id="closed-count" class="ml-2 text-sm text-zinc-600 italic">0</span></h3>
                    </div>
                </div>
                <div class="flex-1 bg-zinc-950 border border-zinc-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-inner">
                    <div class="overflow-y-auto custom-scroll flex-1">
                        <table class="w-full text-left border-separate border-spacing-0" id="closed-table">
                            <thead class="sticky top-0 bg-zinc-950 border-b border-zinc-900 z-10">
                                <tr id="closed-head" class="text-[10px] font-black text-zinc-600 uppercase tracking-widest"></tr>
                            </thead>
                            <tbody id="closed-body" class="divide-y divide-zinc-900"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[3rem] max-w-2xl w-full p-10 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-3xl font-black text-white tracking-tighter">建立調度派車單</h3>
                </div>
                <button onclick="window.closeModal()" class="p-2 hover:bg-zinc-800 rounded-full transition-colors"><i data-lucide="x" class="text-zinc-500"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto custom-scroll space-y-6 pr-4">
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest ml-1">單據類型</label>
                        <select id="input-type" class="w-full px-5 py-4 bg-zinc-800 border border-zinc-700 rounded-2xl text-sm font-bold text-yellow-400 outline-none">
                            <option value="加工件">加工件 (需通知收回)</option>
                            <option value="銷售件">銷售件 (直接送達)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest ml-1">目的地廠商/客戶</label>
                        <input type="text" id="input-vendor" class="w-full px-5 py-4 bg-zinc-800 border border-zinc-700 rounded-2xl text-sm text-white outline-none font-bold">
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest ml-1">載運品項清單</label>
                        <button onclick="window.addItemRow()" class="text-emerald-400 text-[10px] font-black flex items-center bg-emerald-400/10 px-4 py-2 rounded-xl border border-emerald-400/20 hover:bg-emerald-400/20"><i data-lucide="plus" class="w-3 h-3 mr-2"></i> 新增項目</button>
                    </div>
                    <div id="items-container" class="space-y-3"></div>
                </div>
            </div>

            <div class="mt-10 pt-8 border-t border-zinc-800 flex gap-4">
                <button onclick="window.closeModal()" class="flex-1 py-5 text-sm font-black text-zinc-500">取消</button>
                <button onclick="window.saveData()" class="flex-[2] py-5 bg-yellow-400 hover:bg-yellow-300 text-black text-sm font-black rounded-[1.5rem]">確認發佈</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 初始化與配置
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hc-dispatch-system';

        let userAuth = null;
        let unsubscribeSnapshot = null;
        window.masterData = [];
        window.currentUserRole = null;

        // UI 狀態更新邏輯
        function setSyncStatus(status) {
            const btn = document.getElementById('sync-btn');
            const icon = document.getElementById('sync-icon');
            const text = document.getElementById('sync-text');
            if (!btn || !icon || !text) return;

            if (status === 'syncing') {
                icon.setAttribute('data-lucide', 'refresh-cw');
                icon.classList.add('sync-spinner');
                text.innerText = "同步中...";
            } else if (status === 'connected') {
                icon.setAttribute('data-lucide', 'cloud-check');
                icon.classList.remove('sync-spinner');
                text.innerText = "雲端已連線";
                btn.className = "flex items-center space-x-2 px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-xl text-[10px] font-black text-emerald-400";
            } else {
                icon.setAttribute('data-lucide', 'cloud-off');
                icon.classList.remove('sync-spinner');
                text.innerText = "連線失敗";
                btn.className = "flex items-center space-x-2 px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-xl text-[10px] font-black text-red-500";
            }
            if (window.lucide) window.lucide.createIcons();
        }

        function showNotification(title, msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-yellow-400 text-black px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 animate-slide-in';
            toast.innerHTML = `<div><p class="text-[10px] font-black uppercase opacity-60">${title}</p><p class="text-xs font-bold">${msg}</p></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // Firestore 數據處理
        const getMasterDocRef = () => doc(db, 'artifacts', appId, 'public', 'data', 'masterRecords', 'default');

        function listenToCloudData() {
            if (!userAuth) return;
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const docRef = getMasterDocRef();
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.masterData = docSnap.data().records || [];
                } else {
                    window.masterData = [];
                }
                if (window.currentUserRole) window.renderTables();
            }, (error) => {
                console.error("Firestore 監聽失敗:", error);
                setSyncStatus('error');
            });
        }

        async function syncToCloud() {
            if (!userAuth) return;
            setSyncStatus('syncing');
            try {
                const docRef = getMasterDocRef();
                await setDoc(docRef, { 
                    records: window.masterData, 
                    lastUpdated: Date.now(),
                    updatedBy: userAuth.uid 
                });
                setSyncStatus('connected');
            } catch (err) {
                console.error("同步失敗:", err);
                setSyncStatus('error');
                showNotification('同步錯誤', '資料無法上傳');
            }
        }

        // 將重要函數導出至全域 (解決 type="module" 產生的 Script error)
        window.login = (role) => {
            window.currentUserRole = role;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            const roleNameMap = {
                'procure': '採購/業務',
                'factory': '廠務',
                'warehouse': '倉管部',
                'admin': '系統管理員'
            };
            
            document.getElementById('user-role-badge').innerText = roleNameMap[role] || role;
            document.getElementById('current-time-display').innerText = new Date().toLocaleDateString();
            document.getElementById('main-action-btn').classList.toggle('hidden', !(role === 'procure' || role === 'admin'));
            window.renderTables();
        };

        window.logout = () => {
            window.currentUserRole = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        window.openModal = () => { 
            document.getElementById('modal').classList.remove('hidden'); 
            const container = document.getElementById('items-container');
            if(!container.children.length) window.addItemRow(); 
        };

        window.closeModal = () => { 
            document.getElementById('modal').classList.add('hidden'); 
        };

        window.addItemRow = () => {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 gap-2 bg-zinc-950 p-3 rounded-xl border border-zinc-800';
            row.innerHTML = `
                <div class="col-span-5"><input type="text" placeholder="品項名稱" class="it-n w-full bg-transparent text-xs text-white border-b border-zinc-800 outline-none"></div>
                <div class="col-span-3"><input type="number" placeholder="數量" class="it-q w-full bg-transparent text-xs text-white border-b border-zinc-800 outline-none"></div>
                <div class="col-span-2"><input type="text" placeholder="單位" class="it-u w-full bg-transparent text-xs text-white border-b border-zinc-800 outline-none"></div>
                <div class="col-span-2 text-right"><button onclick="this.parentElement.parentElement.remove()" class="text-zinc-600 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button></div>
            `;
            container.appendChild(row);
            if (window.lucide) window.lucide.createIcons();
        };

        window.saveData = () => {
            const vendor = document.getElementById('input-vendor').value;
            const rows = document.querySelectorAll('#items-container > div');
            const items = Array.from(rows).map(r => ({
                n: r.querySelector('.it-n').value,
                q: r.querySelector('.it-q').value,
                u: r.querySelector('.it-u').value
            })).filter(i => i.n && i.q);

            if(!vendor || items.length === 0) {
                showNotification('填寫不全', '請輸入廠商名稱及至少一個品項');
                return;
            }

            const newId = 'HC-' + Math.floor(1000 + Math.random() * 9000);
            window.masterData.unshift({ 
                id: newId, 
                type: document.getElementById('input-type').value, 
                status: '待處理', 
                vendor, 
                items, 
                time: Date.now() 
            });

            window.closeModal();
            document.getElementById('input-vendor').value = '';
            document.getElementById('items-container').innerHTML = '';
            syncToCloud();
        };

        window.updateStatus = (id, status) => {
            const item = window.masterData.find(d => d.id === id);
            if(item) {
                item.status = status;
                syncToCloud();
            }
        };

        window.deleteItem = (id) => {
            if(confirm(`確定要刪除單據 ${id} 嗎？`)) {
                window.masterData = window.masterData.filter(d => d.id !== id);
                syncToCloud();
            }
        };

        window.renderTables = () => {
            const activeBody = document.getElementById('active-body');
            const closedBody = document.getElementById('closed-body');
            if (!activeBody || !closedBody) return;

            const activeData = window.masterData.filter(d => d.status !== '已結案');
            const closedData = window.masterData.filter(d => d.status === '已結案');

            document.getElementById('active-count').innerText = activeData.length;
            document.getElementById('closed-count').innerText = closedData.length;

            const COLUMNS = {
                'procure': ['單號', '狀態', '目的地', '明細', '操作'],
                'factory': ['單號', '狀態', '目的地', '明細', '操作'],
                'warehouse': ['單號', '狀態', '目的地', '明細', '操作'],
                'admin': ['單號', '狀態', '類型', '目的地', '明細', '操作']
            };

            const cols = COLUMNS[window.currentUserRole] || COLUMNS['admin'];
            document.getElementById('active-head').innerHTML = cols.map(c => `<th class="px-6 py-5">${c}</th>`).join('');
            document.getElementById('closed-head').innerHTML = cols.map(c => `<th class="px-6 py-5">${c}</th>`).join('');

            activeBody.innerHTML = activeData.map(item => renderRow(item, cols)).join('');
            closedBody.innerHTML = closedData.map(item => renderRow(item, cols)).join('');
            
            if (window.lucide) window.lucide.createIcons();
        };

        const STATUS_COLORS = {
            '待處理': 'text-zinc-400 bg-zinc-800 border-zinc-700',
            '配送中': 'text-orange-400 bg-orange-400/10 border-orange-400/30',
            '待通知載回': 'text-indigo-400 bg-indigo-400/10 border-indigo-400/30',
            '待載回': 'text-pink-400 bg-pink-400/10 border-pink-400/30',
            '載回中': 'text-violet-400 bg-violet-400/10 border-violet-400/30',
            '待入庫': 'text-emerald-400 bg-emerald-400/10 border-emerald-400/30',
            '已結案': 'text-zinc-600 italic opacity-50'
        };

        function renderRow(item, cols) {
            const itemsList = item.items.map(i => `<div class="text-[11px]"><span class="text-zinc-300 font-bold">${i.n}</span> <span class="text-yellow-400 ml-1">x${i.q}${i.u}</span></div>`).join('');
            const statusBadge = `<span class="px-2 py-1 rounded-lg text-[9px] font-black border ${STATUS_COLORS[item.status] || ''}">${item.status}</span>`;
            
            let actions = [];
            if (window.currentUserRole === 'factory') {
                if(item.status === '待處理') actions.push(actionBtn('配送中', 'bg-orange-600', 'truck', item.id, '開始配送'));
                if(item.status === '配送中') actions.push(actionBtn(item.type === '加工件' ? '待通知載回' : '已結案', 'bg-sky-600', 'check-circle', item.id, '送達'));
                if(item.status === '待載回') actions.push(actionBtn('載回中', 'bg-pink-600', 'rotate-ccw', item.id, '開始載回'));
                if(item.status === '載回中') actions.push(actionBtn('待入庫', 'bg-emerald-600', 'home', item.id, '抵達工廠'));
            } else if (window.currentUserRole === 'procure' || window.currentUserRole === 'admin') {
                if(item.status === '待通知載回' && item.type === '加工件') actions.push(actionBtn('待載回', 'bg-indigo-600', 'bell', item.id, '通知司機'));
                if(window.currentUserRole === 'admin') actions.push(`<button onclick="window.deleteItem('${item.id}')" class="text-red-500 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`);
            } else if (window.currentUserRole === 'warehouse' && item.status === '待入庫') {
                actions.push(actionBtn('已結案', 'bg-emerald-700', 'archive', item.id, '確認入庫'));
            }

            return `<tr>${cols.map(col => {
                let val = '';
                if(col === '單號') val = `<span class="font-mono text-xs text-yellow-500 font-bold">${item.id}</span>`;
                else if(col === '狀態') val = statusBadge;
                else if(col === '目的地') val = `<span class="text-xs font-bold">${item.vendor}</span>`;
                else if(col === '明細') val = itemsList;
                else if(col === '類型') val = `<span class="text-[10px] text-zinc-600">${item.type}</span>`;
                else if(col === '操作') val = `<div class="flex space-x-2">${actions.join('')}</div>`;
                return `<td class="px-6 py-5 align-top">${val}</td>`;
            }).join('')}</tr>`;
        }

        function actionBtn(target, color, icon, id, label='') {
            return `<button onclick="window.updateStatus('${id}', '${target}')" class="${color} text-white px-3 py-1.5 rounded-xl flex items-center space-x-1 hover:brightness-110 active:scale-95 transition-all">
                <i data-lucide="${icon}" class="w-3 h-3"></i>
                ${label ? `<span class="text-[9px] font-bold">${label}</span>` : ''}
            </button>`;
        }

        // 啟動與身份驗證
        (async function init() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => {
                    userAuth = user;
                    if (user) {
                        setSyncStatus('connected');
                        listenToCloudData();
                    } else {
                        setSyncStatus('error');
                    }
                });
            } catch (err) {
                console.error("Auth 初始化失敗:", err);
                setSyncStatus('error');
            }
            if (window.lucide) window.lucide.createIcons();
        })();
    </script>
</body>
