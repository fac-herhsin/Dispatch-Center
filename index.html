<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薪昌載運追蹤管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // ===【重要：請在此處替換你的 GAS 網址】===
        const gasWebappUrl = "https://script.google.com/macros/s/AKfycbzCzrejSV2l1QpY1zmZhrP2_zsbbz52tuGe_5Cc_lnNiC1a1QQ6wx3jw57AiOP4bs1i/exec"; 

        // ===【重新編排後的業務流程定義】===
        const FLOWS = {
            'CNC 二工加工': [
                { id: 'f1', label: '廠務安排載出', role: 'factory' },
                { id: 'f2', label: '師傅載運中', role: 'factory' },
                { id: 'p1', label: '加工廠加工中', role: 'purchase' },
                { id: 'p2', label: '加工廠通知採購完成', role: 'purchase' },
                { id: 'p3', label: '採購通知廠務載回', role: 'purchase' },
                { id: 'f3', label: '廠務安排載回', role: 'factory' },
                { id: 'done', label: '流程完成', role: 'system' }
            ],
            '客戶購買': [
                { id: 'p1', label: '採購接獲訂單', role: 'purchase' },
                { id: 'p2', label: '訂單轉交廠務準備', role: 'purchase' },
                { id: 'f1', label: '廠務安排師師傅載送', role: 'factory' },
                { id: 'done', label: '送達完成', role: 'system' }
            ],
            '鍍鋅加工': [
                { id: 'f1', label: '廠務評估載出(師傅/委外)', role: 'factory' },
                { id: 'p1', label: '鍍鋅廠加工中', role: 'purchase' },
                { id: 'p2', label: '鍍鋅廠通知採購完成', role: 'purchase' },
                { id: 'p3', label: '採購通知廠務已完成', role: 'purchase' },
                { id: 'f2', label: '廠務安排載回(師傅/委外)', role: 'factory' },
                { id: 'done', label: '流程完成', role: 'system' }
            ]
        };

        let currentView = 'login';
        let orders = [];
        let masters = [];
        let items = [{ id: Date.now(), name: '', qty: '' }];
        let isLoading = false;

        const refreshIcons = () => { if (window.lucide) window.lucide.createIcons(); };

        // 同步資料
        window.manualSync = async () => {
            isLoading = true; render();
            try {
                const res = await fetch(`${gasWebappUrl}?t=${Date.now()}`);
                const data = await res.json();
                orders = data.orders || [];
                masters = data.masters || [];
            } catch (e) { console.error(e); }
            isLoading = false; render();
        };

        // 建立新任務 (自動根據登入者身分給予初始狀態)
        window.handleCreate = async () => {
            const customerName = document.getElementById('newCustomerName')?.value;
            const type = document.getElementById('newOrderType')?.value;
            const masterName = document.getElementById('newMasterName')?.value;
            if (!customerName?.trim() || items[0].name === "") return alert("請填寫完整資訊");

            isLoading = true; render();
            const payload = {
                action: "CREATE",
                id: 'HC-' + Date.now().toString().slice(-6),
                type, customerName, masterName,
                items: items.filter(i => i.name),
                status: FLOWS[type][0].label
            };
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify(payload) });
            items = [{ id: Date.now(), name: '', qty: '' }];
            await window.manualSync();
            alert("發布成功");
        };

        // 更新狀態
        window.updateStatus = async (orderId, type, currentStatus) => {
            const flow = FLOWS[type];
            const currentIndex = flow.findIndex(f => f.label === currentStatus);
            const nextStep = flow[currentIndex + 1];

            if (!nextStep) return;
            // 管理員或對應角色可點擊
            if (currentView !== 'admin' && nextStep.role !== 'system' && currentView !== nextStep.role) {
                alert(`權限不足！此步驟應由【${nextStep.role === 'purchase' ? '採購' : '廠務'}】處理`);
                return;
            }

            isLoading = true; render();
            await fetch(gasWebappUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "UPDATE_STATUS", id: orderId, newStatus: nextStep.label })
            });
            await window.manualSync();
        };

        window.deleteOrder = async (id) => {
            if (!confirm("確定刪除？")) return;
            isLoading = true; render();
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify({ action: "DELETE_ORDER", id }) });
            await window.manualSync();
        };

        window.addMaster = async () => {
            const name = document.getElementById('adminMasterName').value;
            if (!name) return;
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify({ action: "ADD_MASTER", name }) });
            document.getElementById('adminMasterName').value = '';
            await window.manualSync();
        };

        window.deleteMaster = async (name) => {
            if (!confirm(`刪除 ${name}?`)) return;
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify({ action: "DELETE_MASTER", name }) });
            await window.manualSync();
        };

        const render = () => {
            const root = document.getElementById('app');
            if (currentView === 'login') {
                root.innerHTML = `<div class="min-h-screen bg-neutral-950 flex flex-col items-center justify-center p-6 text-white">
                    <div class="bg-yellow-500 p-4 rounded-3xl mb-8"><i data-lucide="truck" class="w-12 h-12 text-black"></i></div>
                    <h1 class="text-3xl font-black mb-12">薪昌載運系統</h1>
                    <div class="w-full max-w-sm space-y-3">
                        ${['factory', 'purchase', 'admin'].map(r => `
                            <button onclick="window.login('${r}')" class="w-full p-5 bg-neutral-900 border border-neutral-800 rounded-2xl hover:border-yellow-500 font-bold transition-all">
                                ${r === 'factory' ? '廠務人員入口' : r === 'purchase' ? '採購人員入口' : '管理員控制台'}
                            </button>`).join('')}
                    </div>
                </div>`;
            } else {
                root.innerHTML = `
                <div class="min-h-screen bg-black text-gray-200 pb-20">
                    <header class="p-6 border-b border-neutral-900 flex justify-between items-center bg-neutral-950 sticky top-0 z-50">
                        <div><h1 class="text-xl font-black">薪昌管理</h1><span class="text-[10px] bg-yellow-500 text-black px-2 py-0.5 rounded font-black">${currentView.toUpperCase()}</span></div>
                        <div class="flex gap-2">
                            <button onclick="window.manualSync()" class="p-3 bg-neutral-900 rounded-xl"><i data-lucide="refresh-cw" class="${isLoading ? 'animate-spin' : ''}"></i></button>
                            <button onclick="window.logout()" class="p-3 bg-neutral-900 rounded-xl"><i data-lucide="log-out"></i></button>
                        </div>
                    </header>

                    <main class="max-w-4xl mx-auto p-6 space-y-6">
                        ${currentView === 'admin' ? `
                            <section class="bg-blue-900/10 border border-blue-900/30 p-6 rounded-3xl">
                                <h2 class="font-bold mb-4 text-blue-400">師傅管理</h2>
                                <div class="flex gap-2 mb-4">
                                    <input id="adminMasterName" class="bg-neutral-800 p-2 rounded-xl flex-grow text-sm outline-none" placeholder="姓名">
                                    <button onclick="window.addMaster()" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-bold">新增</button>
                                </div>
                                <div class="flex flex-wrap gap-2">${(masters || []).map(m => `<span class="bg-neutral-800 px-3 py-1 rounded-full text-xs flex items-center gap-2">${m} <i data-lucide="x" class="w-3 h-3 text-red-500 cursor-pointer" onclick="window.deleteMaster('${m}')"></i></span>`).join('')}</div>
                            </section>` : ''}
                        
                        <section class="bg-neutral-900 p-6 rounded-[2rem] border border-neutral-800">
                            <h2 class="font-bold mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-yellow-500 rounded-full"></span> 建立單據</h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                <select id="newOrderType" class="bg-neutral-800 p-3 rounded-xl outline-none text-sm">
                                    ${Object.keys(FLOWS).map(f => `<option value="${f}">${f}</option>`).join('')}
                                </select>
                                <input id="newCustomerName" class="bg-neutral-800 p-3 rounded-xl outline-none text-sm" placeholder="客戶/加工廠名稱">
                                <select id="newMasterName" class="bg-neutral-800 p-3 rounded-xl outline-none text-sm">
                                    <option value="待安排">待安排師傅</option>
                                    ${(masters || []).map(m => `<option value="${m}">${m}</option>`).join('')}
                                    <option value="委外廠商">委外廠商</option>
                                </select>
                            </div>
                            <div class="bg-black/20 p-4 rounded-xl mb-4">
                                ${items.map((item, idx) => `<div class="flex gap-2 mb-2"><input placeholder="品項" class="flex-grow bg-neutral-800 p-2 rounded-lg text-sm" onchange="window.updateItem(${idx},'name',this.value)" value="${item.name}"><input placeholder="量" class="w-16 bg-neutral-800 p-2 rounded-lg text-sm text-center" onchange="window.updateItem(${idx},'qty',this.value)" value="${item.qty}"></div>`).join('')}
                                <button onclick="window.addItem()" class="w-full py-1 border border-dashed border-neutral-700 rounded-lg text-[10px] text-gray-500">+ 增加欄位</button>
                            </div>
                            <button onclick="window.handleCreate()" class="w-full bg-yellow-500 text-black font-black py-3 rounded-xl shadow-lg">發布任務</button>
                        </section>

                        <div class="space-y-4">
                            ${(orders || []).map(o => {
                                const flow = FLOWS[o.type] || [];
                                const currentIndex = flow.findIndex(f => f.label === o.status);
                                const nextStep = flow[currentIndex + 1];
                                const isFinished = currentIndex === flow.length - 1;
                                const isMine = nextStep && (currentView === 'admin' || currentView === nextStep.role || nextStep.role === 'system');

                                return `
                                <div class="bg-neutral-900 p-5 rounded-[1.5rem] border ${isMine && !isFinished ? 'border-yellow-500/50 ring-1 ring-yellow-500/20' : 'border-neutral-800'}">
                                    <div class="flex justify-between items-start mb-3">
                                        <div>
                                            <div class="text-[10px] text-yellow-500 font-bold mb-1">${o.type}</div>
                                            <div class="text-xl font-black">${o.customerName}</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-sm font-bold ${isFinished ? 'text-emerald-500' : 'text-yellow-500'}">${o.status}</div>
                                            <div class="text-[10px] text-gray-500">師傅：${o.masterName}</div>
                                        </div>
                                    </div>
                                    <div class="text-xs text-gray-400 bg-black/40 p-3 rounded-xl mb-4">
                                        ${(o.items || []).map(i => `<div>${i.name} <span class="text-yellow-500 ml-1">x${i.qty}</span></div>`).join('')}
                                    </div>
                                    <div class="flex justify-end gap-2">
                                        ${!isFinished ? `
                                            <button onclick="window.updateStatus('${o.id}', '${o.type}', '${o.status}')" 
                                                class="px-6 py-2 rounded-xl text-xs font-black transition-all
                                                ${isMine ? 'bg-yellow-500 text-black shadow-lg scale-105' : 'bg-neutral-800 text-neutral-600 cursor-not-allowed'}">
                                                ${isMine ? '點擊推進：' + nextStep.label : '等待【' + (nextStep.role === 'purchase' ? '採購' : '廠務') + '】處理'}
                                            </button>
                                        ` : `<div class="text-emerald-500 text-xs font-bold flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> 已完結</div>`}
                                        ${currentView === 'admin' ? `<button onclick="window.deleteOrder('${o.id}')" class="text-red-500 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                                    </div>
                                </div>`
                            }).join('')}
                        </div>
                    </main>
                </div>`;
            }
            refreshIcons();
        };

        window.login = (role) => { currentView = role; window.manualSync(); };
        window.logout = () => { currentView = 'login'; render(); };
        window.addItem = () => { items.push({ id: Date.now(), name: '', qty: '' }); render(); };
        window.updateItem = (idx, f, v) => { items[idx][f] = v; };
        window.onload = () => { render(); };
    </script>
</head>
<body class="bg-black">
    <div id="app"></div>
</body>
</html>
