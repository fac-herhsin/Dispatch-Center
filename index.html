<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #000; 
            margin: 0;
            padding: 0;
        }
        
        .login-card {
            background-color: #1a1a1a;
            border-radius: 50px;
            padding: 60px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-btn {
            background-color: #2a2a2a;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.2s ease;
            border: none;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 16px;
        }
        
        .login-btn:hover { 
            background-color: #333; 
            transform: translateY(-2px);
        }
        
        .admin-btn {
            background-color: #ffcc00;
            color: #000000;
            font-weight: 900;
            width: 100%;
            padding: 20px 0;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 20px rgba(255, 204, 0, 0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .icon-box {
            background-color: #ffcc00;
            width: 100px;
            height: 100px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-item { animation: slideIn 0.3s ease-out forwards; }

        /* 載入中遮罩 */
        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-200">

    <!-- 載入中動畫 -->
    <div id="loading-overlay">
        <div class="w-12 h-12 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-yellow-400 font-bold animate-pulse">正在同步雲端試算表...</p>
    </div>

    <!-- 通知中心 -->
    <div id="toast-container" class="fixed top-6 right-6 z-[300] flex flex-col gap-3 w-72 pointer-events-none"></div>

    <!-- 登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black">
        <div class="login-card text-center">
            <div class="icon-box mb-8">
                <i data-lucide="truck" class="w-14 h-14 text-black"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter mb-2">何鑫 / 薪昌</h1>
            <p class="text-[#ffcc00] font-bold text-sm tracking-[0.4em] uppercase mb-12">載運調度管理系統</p>
            
            <div class="flex flex-col">
                <button onclick="window.login('procure')" class="login-btn">採購/業務部</button>
                <button onclick="window.login('factory')" class="login-btn">廠務調度</button>
                <button onclick="window.login('warehouse')" class="login-btn">倉管部</button>
                <button onclick="window.login('admin')" class="admin-btn">系統管理員</button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-black border-b border-zinc-800 px-8 py-4 flex justify-between items-center z-50">
            <div class="flex items-center space-x-6">
                <div class="flex flex-col">
                    <h2 id="page-title" class="text-xl font-black text-white tracking-tight">載運調度管理系統</h2>
                    <div class="flex items-center space-x-2">
                        <span id="user-role-badge" class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-black uppercase tracking-widest">角色</span>
                        <span class="text-[10px] text-zinc-600 font-bold uppercase" id="current-time-display"></span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="sync-btn" onclick="window.manualSync()" class="flex items-center space-x-2 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-xl text-xs font-bold text-zinc-300 hover:bg-zinc-800">
                    <i id="sync-icon" data-lucide="refresh-cw" class="w-3 h-3"></i>
                    <span>同步雲端</span>
                </button>
                <button id="main-action-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-black flex items-center hidden" onclick="window.openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 新增單據
                </button>
                <button onclick="window.logout()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto custom-scroll p-6 bg-[#050505] space-y-8">
            <section class="flex flex-col min-w-0">
<div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-black text-white flex items-center">
        <span class="w-1.5 h-6 bg-yellow-400 rounded-full mr-3"></span>
        當前調度清單 <span id="active-count" class="ml-2 text-yellow-400 opacity-60">0</span>
    </h3>
    <button onclick="window.printDispatch()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-black transition-all flex items-center gap-2 text-white">
        <i data-lucide="printer" class="w-4 h-4"></i> 批量列印配送單
    </button>
</div>
                <div class="bg-zinc-900/50 border border-zinc-800 rounded-[2rem] overflow-hidden flex flex-col">
                    <table class="w-full text-left border-separate border-spacing-0">
                        <thead class="bg-zinc-900 border-b border-zinc-800">
<tr class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">
<th class="px-6 py-4 w-10">
    <input type="checkbox" id="select-all-checkbox" class="w-5 h-5 cursor-pointer accent-yellow-400" onclick="window.toggleAll(this)">
</th> 
<th class="px-6 py-4">單號/類型</th>
    <th class="px-6 py-4">狀態</th>
    <th class="px-6 py-4">目的地</th>
    <th class="px-6 py-4">內容與備註</th>
    <th class="px-6 py-4">操作</th>
</tr>
                        </thead>
                        <tbody id="active-body" class="divide-y divide-zinc-800/50"></tbody>
                    </table>
                </div>
            </section>

            <section class="flex flex-col min-w-0 opacity-80">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-black text-zinc-400 flex items-center">
                        <span class="w-1.5 h-6 bg-zinc-700 rounded-full mr-3"></span>
                        歷史結案紀錄
                    </h3>
                </div>
                <div class="bg-zinc-900/30 border border-zinc-800/50 rounded-[2rem] overflow-hidden flex flex-col">
                    <table class="w-full text-left border-separate border-spacing-0">
                        <thead class="bg-zinc-900/50">
                            <tr class="text-[10px] font-black text-zinc-600 uppercase tracking-widest">
                                <th class="px-6 py-4">單號</th>
                                <th class="px-6 py-4">類型</th>
                                <th class="px-6 py-4">目的地</th>
                                <th class="px-6 py-4">完成時間</th>
                                <th class="px-6 py-4">內容</th>
                                <th class="px-6 py-4">管理</th>
                            </tr>
                        </thead>
                        <tbody id="history-body" class="divide-y divide-zinc-800/30"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 彈窗: 新增單據 -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-[2.5rem] max-w-lg w-full p-8 shadow-2xl">
            <h3 class="text-2xl font-black text-white mb-6">新增調度單</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單據類型</label>
                        <select id="input-type" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                            <option value="加工件">加工件</option>
                            <option value="銷售">銷售</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">目的地</label>
                        <input type="text" id="input-vendor" placeholder="工廠或客戶名稱" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">品項名稱</label>
                    <input type="text" id="input-item-name" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">數量</label>
                        <input type="number" id="input-item-qty" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 mb-1 block">單位</label>
                        <input type="text" id="input-item-unit" value="件" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 mb-1 block">備註</label>
                    <textarea id="input-note" rows="2" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white outline-none resize-none" placeholder="輸入額外說明..."></textarea>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="window.closeModal()" class="flex-1 py-4 text-zinc-500 font-bold">取消</button>
                <button onclick="window.saveData()" class="flex-1 py-4 bg-yellow-400 text-black font-black rounded-xl">發佈單據</button>
            </div>
        </div>
    </div>

   <script>
    // 1. 你的 GAS 網址（保持不變）
    const gasWebappUrl = "https://script.google.com/macros/s/AKfycbx2i6bAtOgzwsxoTRYov93Ao0TWbIekzzNoG2INF-lTrpFx27zLMrMPyE8ycgiROK4tJg/exec"; 

    window.masterData = [];
    window.currentUserRole = null;

    // 2. 登入邏輯：直接從 Google Sheets 抓取現有資料
    window.login = async (role) => {
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'flex';

        try {
            window.currentUserRole = role;
            // 登入時先去抓一次雲端目前的資料
            await window.manualSync(); 

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            const roles = {'procure':'採購/業務', 'factory':'廠務調度', 'warehouse':'倉管部', 'admin':'系統管理員'};
            document.getElementById('user-role-badge').innerText = roles[role] || role;
            
            const actionBtn = document.getElementById('main-action-btn');
            if (actionBtn) actionBtn.classList.toggle('hidden', !(role === 'procure' || role === 'admin'));

            window.showToast(`歡迎回來，${roles[role]}`, 'success');
        } catch (err) {
            window.showToast('連線失敗，請檢查網路', 'danger');
        } finally {
            loader.style.display = 'none';
        }
    };

    // 3. 核心功能：直接存檔到 Google Sheets
    window.saveData = async () => {
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'flex';

        const newRecord = {
            id: 'HC-' + Date.now().toString().slice(-6),
            type: document.getElementById('input-type').value,
            status: '待處理',
            vendor: document.getElementById('input-vendor').value,
            items: [{ 
                n: document.getElementById('input-item-name').value, 
                q: document.getElementById('input-item-qty').value || 0, 
                u: document.getElementById('input-item-unit').value 
            }],
            note: document.getElementById('input-note').value,
            timestamp: Date.now(),
            creator: window.currentUserRole
        };

        try {
            // 直接發送 POST 請求給 GAS
            const response = await fetch(gasWebappUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "CREATE", ...newRecord })
            });

            // 存檔成功後，本地資料也同步更新並重新渲染畫面
            window.masterData = [newRecord, ...window.masterData];
            window.renderTables();
            window.closeModal();
            window.showToast('單據已同步至 Google Sheets', 'success');

            // 清空輸入框
            document.getElementById('input-vendor').value = '';
            document.getElementById('input-item-name').value = '';
        } catch (e) {
            window.showToast('同步失敗，請稍後再試', 'danger');
        } finally {
            loader.style.display = 'none';
        }
    };

    // 4. 手動同步（從 Sheets 讀取最新資料）
    window.manualSync = async () => {
        const loader = document.getElementById('loading-overlay');
        loader.style.display = 'flex';
        try {
            const resp = await fetch(gasWebappUrl);
            const data = await resp.json();
            window.masterData = data || [];
            window.renderTables();
            window.showToast('已更新雲端資料', 'success');
        } catch (e) {
            window.showToast('同步失敗', 'danger');
        } finally {
            loader.style.display = 'none';
        }
    };

    // 5. 其餘介面功能 (Toast, Modal, Logout, Render)
    window.openModal = () => document.getElementById('modal').classList.remove('hidden');
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
    window.logout = () => { location.reload(); }; // 簡單處理直接重刷頁面

    window.showToast = (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = { success: 'bg-emerald-500', danger: 'bg-red-500', info: 'bg-blue-500' };
        toast.className = `${colors[type]} text-white px-6 py-4 rounded-2xl shadow-xl font-bold toast-item mb-2`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    };

    window.renderTables = () => {
        const activeBody = document.getElementById('active-body');
        const historyBody = document.getElementById('history-body');
        activeBody.innerHTML = '';
        historyBody.innerHTML = '';

        const activeList = window.masterData.filter(r => r.status !== '已結案');
        const historyList = window.masterData.filter(r => r.status === '已結案');

        document.getElementById('active-count').innerText = activeList.length;

activeList.forEach(r => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/5 transition-colors text-white";

// 1. 定義操作按鈕與刪除按鈕
            let actionHtml = '';
            let deleteBtnHtml = '';

            // 廠務調度邏輯
            if (window.currentUserRole === 'factory') {
                if (r.status === '待處理') {
                    actionHtml = `<button onclick="window.updateStatus('${r.id}', '配送中')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-black transition-all">確認配送</button>`;
                } else if (r.status === '配送中') {
                    // 根據類型判斷下一階段：加工件 -> 加工中；銷售 -> 待結案
                    const nextStatus = (r.type === '加工件') ? '加工中' : '待結案';
                    const btnText = (r.type === '加工件') ? '送交加工' : '完成配送';
                    actionHtml = `<button onclick="window.updateStatus('${r.id}', '${nextStatus}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-black transition-all">${btnText}</button>`;
                } else if (r.status === '已完成加工' && r.type === '加工件') {
                    actionHtml = `<button onclick="window.updateStatus('${r.id}', '待結案')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg text-xs font-black transition-all">載回件回廠</button>`;
                } else {
                    actionHtml = `<span class="text-zinc-500 text-[10px]">等待階段更新</span>`;
                }
            } 
            // 採購/業務邏輯 (處理加工件確認)
            else if (window.currentUserRole === 'procure' || window.currentUserRole === 'admin') {
                if (r.status === '加工中' && r.type === '加工件') {
                    actionHtml = `<button onclick="window.updateStatus('${r.id}', '已完成加工')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-black transition-all">確認加工完成</button>`;
                } else if (window.currentUserRole === 'procure') {
                    actionHtml = `<span class="text-zinc-600 text-[10px]">等待處理</span>`;
                }
            }
            
            // 倉管邏輯 (結案)
            if ((window.currentUserRole === 'warehouse' || window.currentUserRole === 'admin') && r.status === '待結案') {
                actionHtml = `<button onclick="window.updateStatus('${r.id}', '已結案')" class="px-4 py-2 bg-zinc-800 hover:bg-emerald-600 rounded-lg text-xs font-bold transition-all text-emerald-400">結案入庫</button>`;
            }

            // 系統管理員專屬：刪除按鈕
            if (window.currentUserRole === 'admin') {
                deleteBtnHtml = `<button onclick="window.deleteRecord('${r.id}')" class="ml-2 p-2 text-zinc-600 hover:text-red-500 transition-colors" title="刪除單據"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
            }

// 2. 渲染至表格 (請替換這部分)
            tr.innerHTML = `
                <td class="px-6 py-5">
                    <input type="checkbox" class="print-checkbox w-5 h-5 rounded border-zinc-700 bg-zinc-800 accent-yellow-400 cursor-pointer" data-id="${r.id}">
                </td>
                <td class="px-6 py-5">
                    <div class="font-black text-yellow-400">${r.id}</div>
                    <div class="text-[10px] text-zinc-500">${r.type}</div>
                </td>
                <td class="px-6 py-5">
                    <span class="px-3 py-1 bg-zinc-800 rounded-full text-[10px] font-bold">${r.status}</span>
                </td>
                <td class="px-6 py-5 font-bold text-lg">${r.vendor}</td>
                <td class="px-6 py-5">
                    <div>${r.items[0].q} x ${r.items[0].n}</div>
                    <div class="text-[10px] text-zinc-500">${r.note || ''}</div>
                </td>
                <td class="px-6 py-5 flex items-center">${actionHtml}${deleteBtnHtml}</td> 
            `;
            activeBody.appendChild(tr);
        });
historyList.forEach(r => {
            const tr = document.createElement('tr');
            tr.className = "text-zinc-500 text-sm hover:bg-white/5 transition-colors";

            // 判斷是否為管理員，若是則顯示刪除按鈕
            let adminActionHtml = '';
            if (window.currentUserRole === 'admin') {
                adminActionHtml = `
                    <button onclick="window.deleteRecord('${r.id}')" class="p-2 text-zinc-600 hover:text-red-500 transition-colors" title="永久刪除歷史紀錄">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>`;
            }

            tr.innerHTML = `
                <td class="px-6 py-4 font-mono">${r.id}</td>
                <td class="px-6 py-4">${r.type}</td>
                <td class="px-6 py-4">${r.vendor}</td>
                <td class="px-6 py-4 text-xs">${r.time || ''}</td>
                <td class="px-6 py-4">${r.items && r.items[0] ? r.items[0].q + ' x ' + r.items[0].n : ''}</td>
                <td class="px-6 py-4 flex items-center justify-between">
                    <span class="text-emerald-500 font-bold">已結案</span>
                    ${adminActionHtml}
                </td>
            `;
            historyBody.appendChild(tr);
        });
        if (window.lucide) lucide.createIcons();
   }; 

// 這裡就是具體位置！請貼入以下這段：
window.updateStatus = async (id, newStatus) => {
    const loader = document.getElementById('loading-overlay');
    if (loader) loader.style.display = 'flex';

    try {
        const response = await fetch(gasWebappUrl, {
            method: 'POST',
            body: JSON.stringify({ 
                action: "UPDATE_STATUS", 
                id: id, 
                status: newStatus 
            })
        });

        if (response.ok) {
            window.showToast(`單據 ${id} 已更新為 ${newStatus}`, 'success');
            await window.manualSync(); 
        } else {
            throw new Error('網路回應不正常');
        }
    } catch (e) {
        window.showToast('更新失敗，請檢查雲端連線', 'danger');
        console.error('Update Error:', e);
    } finally {
        if (loader) loader.style.display = 'none';
    }
};// 新增：系統管理員刪除單據功能
    window.deleteRecord = async (id) => {
        if (!confirm(`確定要刪除單據 ${id} 嗎？此操作將從雲端完全移除。`)) return;

        const loader = document.getElementById('loading-overlay');
        if (loader) loader.style.display = 'flex';

        try {
            const response = await fetch(gasWebappUrl, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "DELETE", 
                    id: id 
                })
            });

            if (response.ok) {
                window.showToast(`單據 ${id} 已成功刪除`, 'danger');
                await window.manualSync(); 
            } else {
                throw new Error();
            }
        } catch (e) {
            window.showToast('刪除失敗，請確認管理員權限', 'danger');
        } finally {
            if (loader) loader.style.display = 'none';
        }} finally {
            if (loader) loader.style.display = 'none';
        }
    };

    // 在這裡貼上：批量列印處理函數
    window.printDispatch = () => {
        // 1. 抓取所有被勾選的單據 ID
        const selectedIds = Array.from(document.querySelectorAll('.print-checkbox:checked')).map(cb => cb.dataset.id);
        
        if (selectedIds.length === 0) {
            alert('請先勾選要列印的單據');
            return;
        }

        // 2. 從目前的資料中過濾出選中的項目
        const printData = window.allData.filter(r => selectedIds.includes(r.id));
        
        // 3. 建立列印內容 (白底黑字風格)
        let printHtml = `
            <div style="padding: 30px; font-family: sans-serif; color: black; background: white;">
                <h1 style="text-align: center; border-bottom: 2px solid black; padding-bottom: 10px;">司機配送/載貨任務單</h1>
                <p style="text-align: right; font-size: 12px;">列印時間：${new Date().toLocaleString()}</p>
                <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                    <thead>
                        <tr style="background: #f2f2f2;">
                            <th style="border: 1px solid black; padding: 8px;">單號/類型</th>
                            <th style="border: 1px solid black; padding: 8px;">目的地/廠商</th>
                            <th style="border: 1px solid black; padding: 8px;">內容數量</th>
                            <th style="border: 1px solid black; padding: 8px;">備註</th>
                            <th style="border: 1px solid black; padding: 8px; width: 80px;">簽收</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        printData.forEach(item => {
            printHtml += `
                <tr style="height: 50px;">
                    <td style="border: 1px solid black; padding: 8px; text-align: center;">${item.id}<br><small>${item.type}</small></td>
                    <td style="border: 1px solid black; padding: 8px; font-weight: bold; font-size: 16px;">${item.vendor}</td>
                    <td style="border: 1px solid black; padding: 8px;">${item.items[0].q} x ${item.items[0].n}</td>
                    <td style="border: 1px solid black; padding: 8px;">${item.note || ''}</td>
                    <td style="border: 1px solid black; padding: 8px;"></td>
                </tr>
            `;
        });

        printHtml += `
                    </tbody>
                </table>
                <p style="margin-top: 15px;"><strong>總計停靠點：${printData.length} 處</strong></p>
            </div>
        `;

        // 4. 開啟新視窗列印
        const printWindow = window.open('', '_blank');
        printWindow.document.write('<html><head><title>任務單列印</title></head><body>' + printHtml + '</body></html>');
        printWindow.document.close();
        
      setTimeout(() => {
            printWindow.print();
            printWindow.close();
     }, 500);
    }; // 這是 printDispatch 的結尾 (第 577 行)

    // 在這裡插入「一鍵全選」邏輯
    window.toggleAll = (source) => {
        const checkboxes = document.querySelectorAll('.print-checkbox');
        checkboxes.forEach(cb => {
            cb.checked = source.checked;
        });
    };

    // 確保這行保留在最後面 (第 580 行)
    window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
</script>
