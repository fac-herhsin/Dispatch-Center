<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫實業 / 薪昌 - 載運追蹤管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, query, onSnapshot, addDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 1. 重要：請填入你的 Firebase 配置 ---
    // 你可以在 Firebase 控制台 > 專案設定 > 您的應用程式中找到這段 JSON
    const firebaseConfig = {
        apiKey: "你的API_KEY",
        authDomain: "你的PROJECT_ID.firebaseapp.com",
        projectId: "你的PROJECT_ID",
        storageBucket: "你的PROJECT_ID.appspot.com",
        messagingSenderId: "你的SENDER_ID",
        appId: "你的APP_ID"
    };

    let firebaseApp, auth, db;
    const appId = 'logistic-track-system';
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzCzrejSV2l1QpY1zmZhrP2_zsbbz52tuGe_5Cc_lnNiC1a1QQ6wx3jw57AiOP4bs1i/exec"; 

    // 狀態管理
    let user = null;
    let currentView = 'login';
    let orders = [];
    let items = [{ id: Date.now(), name: '', qty: '', note: '' }];
    let initialized = false;

    // --- 2. 修正後的 Google Sheets 同步函數 ---
    async function syncToGoogleSheets(orderData) {
        if (!SHEET_API_URL) return;
        try {
            // 使用 URLSearchParams 處理跨域 POST 轉 GET 的問題（Google Apps Script 特性）
            const formData = new URLSearchParams();
            formData.append("data", JSON.stringify({
                ...orderData,
                timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
            }));

            // Google Apps Script 接收 POST 較嚴格，建議使用 fetch 但不處理回應
            await fetch(SHEET_API_URL, {
                method: 'POST',
                mode: 'no-cors', // 必須維持 no-cors，否則會觸發 CORS 錯誤
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });
            console.log("資料已嘗試傳送至試算表");
        } catch (err) {
            console.error("試算表同步錯誤:", err);
        }
    }

    // --- 3. 修改後的初始化流程 ---
    const startApp = async () => {
        try {
            firebaseApp = initializeApp(firebaseConfig);
            auth = getAuth(firebaseApp);
            db = getFirestore(firebaseApp);

            onAuthStateChanged(auth, async (u) => {
                if (!u) {
                    await signInAnonymously(auth);
                }
                user = u;
                initialized = true;
                
                if (user) {
                    // 修正路徑：確保與 Firebase Console 內的路徑一致
                    const q = query(collection(db, 'orders')); 
                    onSnapshot(q, (snap) => {
                        orders = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                                     .sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
                        render();
                    });
                }
                render();
            });
        } catch (err) {
            console.error("初始化失敗:", err);
            alert("系統連線失敗，請檢查 Firebase 配置");
        }
    };

    // (其餘 render, handleCreate 等函數保持不變，但請確認 addDoc 的路徑)
    window.handleCreate = async () => {
        if (!db) return alert("資料庫未就緒");
        // ... 原有的獲取資料邏輯 ...
        try {
            const docRef = await addDoc(collection(db, 'orders'), newOrder);
            await syncToGoogleSheets({ id: docRef.id, ...newOrder });
            items = [{ id: Date.now(), name: '', qty: '', note: '' }];
            render();
        } catch (e) { alert("發布失敗"); }
    };

    window.onload = startApp;
</script>
</head>
<body class="bg-black antialiased">
    <div id="app"></div>
</body>
</html>
