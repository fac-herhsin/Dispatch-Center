<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何鑫實業/薪昌載運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // ===【重要：請在此處確認你的 GAS 網址】===
        const gasWebappUrl = "https://script.google.com/macros/s/AKfycbxH9NsFpOkALtoFxkACscXvfOWbY7aofphB7Z7EFDC8qE96zwAlrWHYWPfsyPyj6mnV/exec"; 

        // ===【全新業務流程定義】===
        const FLOWS = {
            '銷售': [
                { id: 's1', label: '採購新增單據', role: 'purchase' },
                { id: 's2', label: '廠務接收單據整備', role: 'factory' },
                { id: 's3', label: '廠務出貨', role: 'factory' },
                { id: 'done', label: '任務結案', role: 'system' }
            ],
            'CNC 二工加工': [
                { id: 'c1', label: '廠務出貨', role: 'factory' },
                { id: 'c2', label: '加工完成(廠商通知採購)', role: 'purchase' },
                { id: 'c3', label: '可載貨(採購通知廠務)', role: 'purchase' },
                { id: 'c4', label: '廠務載回', role: 'factory' },
                { id: 'done', label: '任務結案', role: 'system' }
            ],
            '鍍鋅加工': [
                { id: 'g1', label: '廠務出貨', role: 'factory' },
                { id: 'g2', label: '加工完成(廠商通知採購)', role: 'purchase' },
                { id: 'g3', label: '可載貨(採購通知廠務)', role: 'purchase' },
                { id: 'g4', label: '廠務/委外載回', role: 'factory' },
                { id: 'done', label: '任務結案', role: 'system' }
            ]
        };

        let currentView = 'login';
        let orders = [];
        let masters = [];
        let items = [{ id: Date.now(), name: '', qty: '' }];
        let isLoading = false;

        const refreshIcons = () => { if (window.lucide) window.lucide.createIcons(); };

        window.manualSync = async () => {
            isLoading = true; render();
            try {
                const res = await fetch(`${gasWebappUrl}?t=${Date.now()}`);
                const data = await res.json();
                orders = data.orders || [];
                masters = data.masters || [];
            } catch (e) { console.error("同步失敗", e); }
            isLoading = false; render();
        };

        window.handleCreate = async () => {
            const customerName = document.getElementById('newCustomerName')?.value;
            const type = document.getElementById('newOrderType')?.value;
            const masterName = document.getElementById('newMasterName')?.value;
            
            if (!customerName?.trim() || items.length === 0 || !items[0].name.trim()) {
                return alert("請填寫目的地與至少一項明細品項！");
            }

            // 過濾無效空列
            const validItems = items.filter(i => i.name.trim() !== "");

            isLoading = true; render();
            const payload = {
                action: "CREATE",
                id: 'HC-' + Date.now().toString().slice(-6),
                type, customerName, masterName,
                items: validItems,
                status: FLOWS[type][0].label
            };
            
            try {
                await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify(payload) });
                items = [{ id: Date.now(), name: '', qty: '' }];
                await window.manualSync();
            } catch (e) {
                alert("發布失敗，請檢查網路連接");
                isLoading = false; render();
            }
        };

        window.updateStatus = async (orderId, type, currentStatus) => {
            const flow = FLOWS[type];
            const currentIndex = flow.findIndex(f => f.label === currentStatus);
            const nextStep = flow[currentIndex + 1];

            if (!nextStep) return;
            if (currentView !== 'admin' && nextStep.role !== 'system' && currentView !== nextStep.role) {
                alert(`權限不足！此步驟需由【${nextStep.role === 'purchase' ? '採購人員' : '廠務人員'}】執行`);
                return;
            }

            isLoading = true; render();
            await fetch(gasWebappUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "UPDATE_STATUS", id: orderId, newStatus: nextStep.label })
            });
            await window.manualSync();
        };

        window.deleteOrder = async (id) => {
            if (!confirm("確定要刪除這筆單據嗎？")) return;
            isLoading = true; render();
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify({ action: "DELETE_ORDER", id }) });
            await window.manualSync();
        };

        window.addMaster = async () => {
            const name = document.getElementById('adminMasterName').value;
            if (!name) return;
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify({ action: "ADD_MASTER", name }) });
            document.getElementById('adminMasterName').value = '';
            await window.manualSync();
        };

        window.deleteMaster = async (name) => {
            if (!confirm(`確定刪除師傅：${name}?`)) return;
            await fetch(gasWebappUrl, { method: 'POST', body: JSON.stringify({ action: "DELETE_MASTER", name }) });
            await window.manualSync();
        };

        window.login = (role) => { currentView = role; window.manualSync(); };
        window.logout = () => { currentView = 'login'; render(); };
        window.addItem = () => { items.push({ id: Date.now(), name: '', qty: '' }); render(); };
        window.updateItem = (idx, f, v) => { items[idx][f] = v; };

        const render = () => {
            const root = document.getElementById('app');
            if (currentView === 'login') {
                root.innerHTML = `<div class="min-h-screen bg-neutral-950 flex flex-col items-center justify-center p-6 text-white text-center">
                    <div class="bg-yellow-500 p-4 rounded-3xl mb-6 shadow-2xl shadow-yellow-500/20"><i data-lucide="truck" class="w-12 h-12 text-black"></i></div>
                    <div class="mb-12">
                        <h1 class="text-4xl font-black tracking-tight mb-2">何鑫實業</h1>
                        <p class="text-yellow-500 font-bold tracking-[0.3em] text-sm">薪昌載運管理系統</p>
                    </div>
                    <div class="w-full max-w-sm space-y-3">
                        ${[
                            { role: 'purchase', label: '採購人員入口' },
                            { role: 'factory', label: '廠務人員入口' },
                            { role: 'admin', label: '管理員控制台' }
                        ].map(r => `
                            <button onclick="window.login('${r.role}')" class="w-full p-5 bg-neutral-900 border border-neutral-800 rounded-2xl hover:border-yellow-500 font-bold transition-all shadow-lg active:scale-95 text-white">
                                ${r.label}
                            </button>`).join('')}
                    </div>
                </div>`;
            } else {
                root.innerHTML = `
                <div class="min-h-screen bg-black text-gray-200 pb-20">
                    <header class="p-6 border-b border-neutral-900 flex justify-between items-center bg-neutral-950/80 backdrop-blur-md sticky top-0 z-50">
                        <div>
                            <h1 class="text-lg font-black text-white">何鑫實業 / 薪昌載運</h1>
                            <span class="text-[10px] bg-yellow-500 text-black px-2 py-0.5 rounded font-black uppercase">
                                ${currentView === 'purchase' ? '採購權限' : currentView === 'factory' ? '廠務權限' : '最高管理員'}
                            </span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.manualSync()" class="p-3 bg-neutral-900 rounded-xl hover:bg-neutral-800"><i data-lucide="refresh-cw" class="${isLoading ? 'animate-spin text-yellow-500' : ''}"></i></button>
                            <button onclick="window.logout()" class="p-3 bg-neutral-900 rounded-xl hover:text-red-500"><i data-lucide="log-out"></i></button>
                        </div>
                    </header>

                    <main class="max-w-4xl mx-auto p-6 space-y-8">
                        ${currentView === 'admin' ? `
                            <section class="bg-blue-900/10 border border-blue-900/30 p-6 rounded-[2rem]">
                                <h2 class="font-bold mb-4 text-blue-400 flex items-center gap-2 text-sm"><i data-lucide="settings" class="w-4 h-4"></i> 師傅名單維護</h2>
                                <div class="flex gap-2 mb-4">
                                    <input id="adminMasterName" class="bg-neutral-800 p-3 rounded-xl flex-grow text-sm outline-none focus:ring-1 ring-blue-500 text-white" placeholder="師傅姓名">
                                    <button onclick="window.addMaster()" class="bg-blue-600 px-6 py-2 rounded-xl text-sm font-bold shadow-lg shadow-blue-600/20 text-white">新增</button>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    ${(masters || []).map(m => `<span class="bg-neutral-800 px-3 py-1 rounded-lg text-xs flex items-center gap-2 border border-neutral-700 text-white">${m} <i data-lucide="x" class="w-3 h-3 text-red-500 cursor-pointer hover:scale-125" onclick="window.deleteMaster('${m}')"></i></span>`).join('')}
                                </div>
                            </section>` : ''}
                        
                        <section class="bg-neutral-900 p-6 rounded-[2.5rem] border border-neutral-800 shadow-xl">
                            <h2 class="font-bold mb-6 flex items-center gap-2 text-white"><span class="w-1.5 h-5 bg-yellow-500 rounded-full"></span> 建立載運任務</h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                <div class="space-y-1"><label class="text-[10px] text-gray-500 font-bold ml-1">載運類別</label>
                                    <select id="newOrderType" class="w-full bg-neutral-800 p-4 rounded-xl outline-none text-sm border border-transparent focus:border-yellow-500 text-white">
                                        ${Object.keys(FLOWS).map(f => `<option value="${f}">${f}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="space-y-1"><label class="text-[10px] text-gray-500 font-bold ml-1">目的地(客戶/外協加工廠)</label>
                                    <input id="newCustomerName" class="w-full bg-neutral-800 p-4 rounded-xl outline-none text-sm border border-transparent focus:border-yellow-500 text-white" placeholder="請輸入名稱">
                                </div>
                                <div class="space-y-1"><label class="text-[10px] text-gray-500 font-bold ml-1">負責司機/師傅</label>
                                    <select id="newMasterName" class="w-full bg-neutral-800 p-4 rounded-xl outline-none text-sm border border-transparent focus:border-yellow-500 text-white">
                                        <option value="待安排">待安排</option>
                                        ${(masters || []).map(m => `<option value="${m}">${m}</option>`).join('')}
                                        <option value="委外廠商">委外廠商</option>
                                    </select>
                                </div>
                            </div>
                            <div class="bg-black/40 p-5 rounded-2xl mb-6 border border-neutral-800">
                                <p class="text-[10px] text-gray-500 font-bold mb-3 uppercase tracking-widest">品項載運明細</p>
                                <div id="items-container">
                                    ${items.map((item, idx) => `
                                        <div class="flex gap-2 mb-2">
                                            <input placeholder="品項/工件名稱" class="flex-grow bg-neutral-800 p-3 rounded-xl text-sm text-white" oninput="window.updateItem(${idx},'name',this.value)" value="${item.name}">
                                            <input placeholder="數量" class="w-20 bg-neutral-800 p-3 rounded-xl text-sm text-center text-white" oninput="window.updateItem(${idx},'qty',this.value)" value="${item.qty}">
                                        </div>`).join('')}
                                </div>
                                <button onclick="window.addItem()" class="w-full py-2 border border-dashed border-neutral-700 rounded-xl text-[10px] text-gray-500 hover:text-yellow-500 transition-all">+ 增加品項欄位</button>
                            </div>
                            <button onclick="window.handleCreate()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl shadow-lg shadow-yellow-500/10 hover:scale-[1.01] active:scale-[0.98] transition-all">確認並發布任務</button>
                        </section>

                        <div class="space-y-4">
                            <h2 class="text-xs font-bold text-neutral-500 ml-2 tracking-widest uppercase">即時看板 (共 ${(orders || []).length} 筆)</h2>
                            ${(orders || []).length === 0 ? `<div class="text-center py-20 text-neutral-800 border-2 border-dashed border-neutral-900 rounded-[2rem]">暫無進行中的單據</div>` : 
                              orders.map(o => {
                                const flow = FLOWS[o.type] || [];
                                const currentIndex = flow.findIndex(f => f.label === o.status);
                                const nextStep = flow[currentIndex + 1];
                                const isFinished = currentIndex === flow.length - 1 || o.status === '任務結案';
                                
                                // 判斷當前登入者是否可以審核下一步
                                const isMine = nextStep && (currentView === 'admin' || currentView === nextStep.role || nextStep.role === 'system');
                                const roleLabel = nextStep ? (nextStep.role === 'purchase' ? '採購' : '廠務') : '';

                                return `
                                <div class="bg-neutral-900 p-6 rounded-[2rem] border ${isMine && !isFinished ? 'border-yellow-500/50 ring-2 ring-yellow-500/10' : 'border-neutral-800'} transition-all shadow-xl">
                                    <div class="flex justify-between items-start mb-4">
                                        <div>
                                            <div class="text-[10px] text-yellow-500 font-black mb-1 px-2 py-0.5 bg-yellow-500/10 rounded inline-block border border-yellow-500/20">${o.type}</div>
                                            <div class="text-2xl font-black text-white">${o.customerName}</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-lg font-black ${isFinished ? 'text-emerald-500' : 'text-yellow-500'}">${o.status}</div>
                                            <div class="text-[10px] text-gray-500 font-bold">負責人：${o.masterName}</div>
                                        </div>
                                    </div>
                                    <div class="text-sm text-gray-300 bg-black/40 p-4 rounded-2xl mb-6 border border-neutral-800/50">
                                        ${(o.items || []).map(i => `<div class="flex justify-between mb-1"><span>${i.name}</span><span class="font-black text-yellow-500">x${i.qty}</span></div>`).join('')}
                                    </div>
                                    <div class="flex justify-between items-center gap-3 border-t border-neutral-800 pt-5">
                                        <div class="text-xs text-neutral-500">
                                            單號: <span class="text-neutral-400 font-mono">${o.id}</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            ${!isFinished ? `
                                                <button onclick="window.updateStatus('${o.id}', '${o.type}', '${o.status}')" 
                                                    class="px-8 py-3 rounded-2xl text-xs font-black transition-all shadow-xl
                                                    ${isMine ? 'bg-yellow-500 text-black hover:scale-105 active:scale-95' : 'bg-neutral-800 text-neutral-600 cursor-not-allowed opacity-50'}">
                                                    ${isMine ? '進度推進：' + nextStep.label : '等待【' + roleLabel + '】處理'}
                                                </button>
                                            ` : `<div class="text-emerald-500 text-sm font-black flex items-center gap-2 px-4 py-2 bg-emerald-500/10 rounded-xl border border-emerald-500/20"><i data-lucide="check-circle" class="w-4 h-4"></i> 任務結案</div>`}
                                            ${currentView === 'admin' ? `<button onclick="window.deleteOrder('${o.id}')" class="text-red-500/50 hover:text-red-500 transition-all p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
                                        </div>
                                    </div>
                                </div>`
                              }).join('')}
                        </div>
                    </main>
                </div>`;
            }
            refreshIcons();
        };

        window.onload = () => { render(); };
    </script>
</head>
<body class="bg-black text-white selection:bg-yellow-500 selection:text-black">
    <div id="app"></div>
</body>
</html>
