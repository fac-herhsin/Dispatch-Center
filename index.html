<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業調度系統 - 列印優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        #login-screen {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        /* 列印專屬樣式 */
        @media print {
            body { background-color: white; }
            header, #main-action-btn, #print-action-btn, .action-cell, button {
                display: none !important;
            }
            #content-area { padding: 0 !important; }
            .max-w-7xl { max-width: 100% !important; }
            .rounded-3xl, .shadow-sm { border-radius: 0 !important; box-shadow: none !important; border-color: #000 !important; }
            table { width: 100% !important; border: 1px solid #000 !important; }
            th, td { border: 1px solid #000 !important; color: black !important; padding: 8px !important; }
            .print-only-title { display: block !important; margin-bottom: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        }
        .print-only-title { display: none; }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <!-- 登入頁面 -->
    <div id="login-screen" class="fixed inset-0 z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-10 shadow-2xl w-full max-w-md">
            <div class="flex flex-col items-center mb-10">
                <div class="bg-blue-600 p-4 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">企業資源調度系統</h1>
                <p class="text-slate-400 text-sm mt-1">請選擇所屬部門登入</p>
            </div>
            
            <div class="space-y-3">
                <button onclick="login('procure')" class="w-full flex items-center justify-between px-6 py-4 bg-slate-50 hover:bg-blue-50 border border-slate-100 rounded-2xl transition-all group">
                    <div class="flex items-center">
                        <i data-lucide="shopping-cart" class="w-5 h-5 mr-4 text-slate-400 group-hover:text-blue-600"></i>
                        <span class="font-bold text-slate-700">採購部</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>
                <button onclick="login('factory')" class="w-full flex items-center justify-between px-6 py-4 bg-slate-50 hover:bg-blue-50 border border-slate-100 rounded-2xl transition-all group">
                    <div class="flex items-center">
                        <i data-lucide="truck" class="w-5 h-5 mr-4 text-slate-400 group-hover:text-blue-600"></i>
                        <span class="font-bold text-slate-700">廠務部</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>
                <button onclick="login('warehouse')" class="w-full flex items-center justify-between px-6 py-4 bg-slate-50 hover:bg-blue-50 border border-slate-100 rounded-2xl transition-all group">
                    <div class="flex items-center">
                        <i data-lucide="package" class="w-5 h-5 mr-4 text-slate-400 group-hover:text-blue-600"></i>
                        <span class="font-bold text-slate-700">倉管部</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>
                <button onclick="login('admin')" class="w-full flex items-center justify-between px-6 py-4 bg-slate-900 hover:bg-slate-800 rounded-2xl transition-all group shadow-lg">
                    <div class="flex items-center">
                        <i data-lucide="user-cog" class="w-5 h-5 mr-4 text-slate-400"></i>
                        <span class="font-bold text-white">系統管理員</span>
                    </div>
                    <i data-lucide="lock" class="w-4 h-4 text-slate-500"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 主應用程式區 -->
    <div id="main-app" class="flex flex-col h-screen hidden">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm z-10">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3 border-r border-slate-200 pr-6">
                    <div class="bg-blue-600 p-2 rounded-lg text-white"><i data-lucide="layers" class="w-5 h-5"></i></div>
                    <span class="text-xl font-black text-slate-900 tracking-tighter">調度 PRO</span>
                </div>
                <div>
                    <h2 id="page-title" class="text-lg font-bold text-slate-800">載入中...</h2>
                    <div class="flex items-center text-[11px] text-slate-500 space-x-2">
                        <span id="user-role-badge" class="bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-bold uppercase">角色</span>
                        <span id="page-desc">權限受控介面</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- 批量列印按鈕 (廠務部專用) -->
                <button id="print-action-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold flex items-center transition-all shadow-lg shadow-blue-500/20 hidden" onclick="printSelected()">
                    <i data-lucide="printer" class="w-4 h-4 mr-2"></i> 列印配送清單
                </button>
                <button id="main-action-btn" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-xs font-bold flex items-center transition-all shadow-sm hidden" onclick="openModal()">
                    <i data-lucide="plus" class="w-4 h-4 mr-2"></i> 建立新單據
                </button>
                <div class="h-8 w-[1px] bg-slate-200 mx-2"></div>
                <button onclick="logout()" class="flex items-center space-x-2 text-slate-500 hover:text-red-600 transition-colors group">
                    <div class="flex flex-col items-end mr-2">
                        <span id="user-display" class="text-xs font-bold text-slate-700">使用者</span>
                        <span class="text-[10px] text-slate-400">點擊登出</span>
                    </div>
                    <div class="p-2 rounded-full bg-slate-50 group-hover:bg-red-50 transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </div>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-hidden flex flex-col bg-slate-50">
            <section id="content-area" class="p-8 flex-1 overflow-y-auto custom-scroll">
                <div class="max-w-7xl mx-auto">
                    <!-- 列印時才顯示的標題 -->
                    <div class="print-only-title">
                        配送人員單日派車清單
                        <div class="text-sm font-normal mt-2">列印日期：<span id="print-date"></span></div>
                    </div>

                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse" id="main-table">
                            <thead id="table-head" class="bg-slate-50/50 border-b border-slate-100"></thead>
                            <tbody id="table-body" class="text-slate-700 divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 單據 Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-4xl w-full p-8 shadow-2xl border border-slate-200 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="file-plus" class="w-5 h-5"></i></div>
                    <h3 class="text-xl font-bold text-slate-900 tracking-tight">建立調度單據</h3>
                </div>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full transition-colors"><i data-lucide="x" class="text-slate-400"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scroll pr-2 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">單據類型</label>
                        <select id="input-type" class="w-full px-4 py-3 bg-blue-50 border-0 rounded-xl text-sm font-bold text-blue-700">
                            <option value="加工件">加工件 (需載回)</option>
                            <option value="銷售件">銷售件 (送達即結案)</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">單據編號</label>
                        <input type="text" id="input-id" class="w-full px-4 py-3 bg-slate-50 border-0 rounded-xl text-sm font-mono text-slate-500" readonly>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">廠商名稱 / 加工廠</label>
                    <input type="text" id="input-vendor" placeholder="輸入廠商完整名稱" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm outline-none">
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">內容物清單與個別備註</label>
                        <button onclick="addItemRow()" class="text-blue-600 text-xs font-bold flex items-center hover:bg-blue-50 px-2 py-1 rounded-lg"><i data-lucide="plus-circle" class="w-3 h-3 mr-1"></i> 新增項目</button>
                    </div>
                    <div id="items-container" class="space-y-3"></div>
                </div>
            </div>
            <div class="mt-8 grid grid-cols-2 gap-3 pt-6 border-t border-slate-100">
                <button onclick="closeModal()" class="px-6 py-3 text-sm font-bold text-slate-500 hover:bg-slate-50 rounded-xl">取消</button>
                <button onclick="saveData()" class="px-6 py-3 bg-blue-600 text-white text-sm font-black rounded-xl shadow-lg">提交單據</button>
            </div>
        </div>
    </div>

    <!-- 通知小視窗 -->
    <div id="notify-box" class="fixed top-20 right-6 z-[300] hidden">
        <div class="bg-blue-600 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center space-x-4 animate-in slide-in-from-right duration-300">
            <div class="bg-white/20 p-2 rounded-xl"><i data-lucide="info" class="w-5 h-5"></i></div>
            <p id="notify-msg" class="text-sm font-bold">您有新的單據待處理</p>
            <button onclick="hideNotify()" class="text-white/50 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
    </div>

    <script>
        const deptConfigs = {
            'procure': { title: '採購管理看板', role: '採購部主管', columns: ['單號', '狀態', '廠商', '品項與用途備註', '操作'] },
            'factory': { title: '廠務調度看板', role: '廠務部調度', columns: ['選取', '單號', '狀態', '目的地', '品項與用途備註', '操作'] },
            'warehouse': { title: '倉管收貨看板', role: '倉管人員', columns: ['單號', '狀態', '來源', '品項與備註', '操作'] },
            'admin': { title: '系統管理員總表', role: '管理員', columns: ['單號', '狀態', '類型', '廠商', '詳細內容', '操作'] }
        };

        let currentUser = null;
        let masterData = [
            { 
                id: 'PO-9001', 
                type: '加工件', 
                status: '待處理', 
                vendor: '隆昌熱處理', 
                items: [{n:'主軸', q:'100', u:'pcs', note:'CNC-01 維修用'}, {n:'齒輪組', q:'20', u:'set', note:'Project-B 預備件'}], 
                time: Date.now() - 86400000 
            }
        ];

        function login(role) {
            currentUser = role;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            const config = deptConfigs[role];
            document.getElementById('page-title').innerText = config.title;
            document.getElementById('user-role-badge').innerText = config.role;
            document.getElementById('user-display').innerText = config.role;
            
            document.getElementById('main-action-btn').className = (role === 'procure' || role === 'admin') ? 'bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-xs font-bold flex items-center transition-all shadow-sm' : 'hidden';
            
            // 只有廠務部可以看到列印按鈕
            document.getElementById('print-action-btn').classList.toggle('hidden', role !== 'factory');

            renderTable(role);
            checkNotifications();
            lucide.createIcons();
        }

        function logout() {
            currentUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function renderTable(viewMode) {
            const config = deptConfigs[viewMode];
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-head');
            
            thead.innerHTML = `<tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest">${config.columns.map(c => `<th class="px-6 py-4">${c}</th>`).join('')}</tr>`;

            tbody.innerHTML = masterData.filter(d => viewMode === 'warehouse' ? (d.status === '待入庫' || d.status === '已結案') : true).map(item => {
                let colData = [];
                let actions = [];
                
                const formattedItems = item.items.map(i => `
                    <div class="mb-1 text-xs">
                        <span class="font-bold text-slate-900">${i.n}</span> <span class="text-slate-500">(${i.q}${i.u})</span>
                        ${i.note ? `<span class="ml-2 px-2 py-0.5 bg-blue-50 text-blue-600 rounded text-[10px] border border-blue-100 italic">註: ${i.note}</span>` : ''}
                    </div>
                `).join('');

                const deleteBtn = currentUser === 'admin' ? `<button onclick="deleteDoc('${item.id}')" class="text-red-400 p-2 hover:bg-red-50 hover:text-red-600 rounded-lg ml-1 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : '';

                if (viewMode === 'procure') {
                    colData = [item.id, item.status, item.vendor, formattedItems];
                    if(item.status === '待通知載回') actions.push(`<button onclick="updateStatus('${item.id}', '待載回')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">通知載回</button>`);
                } else if (viewMode === 'factory') {
                    // 廠務部增加選取框
                    const checkbox = `<input type="checkbox" class="print-checkbox w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" value="${item.id}">`;
                    colData = [checkbox, item.id, item.status, item.vendor, formattedItems];
                    if(item.status === '待處理') actions.push(`<button onclick="updateStatus('${item.id}', '配送中')" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">執行配送</button>`);
                    if(item.status === '配送中') actions.push(`<button onclick="factoryComplete('${item.id}')" class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">配送完成</button>`);
                    if(item.status === '待載回') actions.push(`<button onclick="updateStatus('${item.id}', '載回中')" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">執行載回</button>`);
                    if(item.status === '載回中') actions.push(`<button onclick="updateStatus('${item.id}', '待入庫')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">抵達工廠</button>`);
                } else if (viewMode === 'warehouse') {
                    colData = [item.id, item.status, item.vendor, formattedItems];
                    if(item.status === '待入庫') actions.push(`<button onclick="updateStatus('${item.id}', '已結案')" class="bg-green-700 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">確認入庫</button>`);
                } else if (viewMode === 'admin') {
                    colData = [item.id, item.status, item.type, item.vendor, formattedItems];
                }

                const statusColors = {
                    '待處理': 'text-slate-400 bg-slate-100',
                    '配送中': 'text-blue-600 bg-blue-50',
                    '待通知載回': 'text-orange-600 bg-orange-50',
                    '待載回': 'text-red-600 bg-red-50',
                    '載回中': 'text-indigo-600 bg-indigo-50',
                    '待入庫': 'text-green-600 bg-green-50',
                    '已結案': 'text-slate-400 line-through'
                };

                return `<tr class="hover:bg-slate-50 transition-colors item-row" data-id="${item.id}">
                    <td class="px-6 py-5">${colData[0].toString().includes('type="checkbox"') ? colData[0] : `<span class="font-mono text-xs font-bold text-blue-600">${colData[0]}</span>`}</td>
                    <td class="px-6 py-5">
                        <span class="px-2 py-1 rounded text-[10px] font-bold ${statusColors[item.status] || 'bg-slate-100'}">${item.status}</span>
                    </td>
                    ${colData.slice(2).map(d => `<td class="px-6 py-5 text-sm">${d}</td>`).join('')}
                    <td class="px-6 py-5 text-right whitespace-nowrap action-cell">${actions.join(' ')}${deleteBtn}</td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        // 列印功能
        function printSelected() {
            const checkedBoxes = document.querySelectorAll('.print-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('請先勾選欲列印配送的單據');
                return;
            }

            const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
            const rows = document.querySelectorAll('.item-row');
            
            // 設定列印日期
            document.getElementById('print-date').innerText = new Date().toLocaleString();

            // 先隱藏沒被勾選的列
            rows.forEach(row => {
                const id = row.getAttribute('data-id');
                if (!selectedIds.includes(id)) {
                    row.classList.add('print:hidden');
                } else {
                    row.classList.remove('print:hidden');
                }
            });

            window.print();
        }

        function updateStatus(id, status) {
            const item = masterData.find(d => d.id === id);
            if(item) {
                item.status = status;
                renderTable(currentUser);
                showToast(`單據 ${id} 狀態已更新`);
            }
        }

        function factoryComplete(id) {
            const item = masterData.find(d => d.id === id);
            if(!item) return;
            const nextStatus = item.type === '銷售件' ? '已結案' : '待通知載回';
            updateStatus(id, nextStatus);
        }

        function deleteDoc(id) {
            if(!confirm(`確定要永久刪除單據 ${id} 嗎？`)) return;
            masterData = masterData.filter(d => d.id !== id);
            renderTable(currentUser);
            showToast(`單據 ${id} 已刪除`);
        }

        function addItemRow() {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-100';
            row.innerHTML = `
                <div class="col-span-3"><input type="text" placeholder="品項" class="item-n w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 ring-blue-500"></div>
                <div class="col-span-2"><input type="number" placeholder="量" class="item-q w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 ring-blue-500"></div>
                <div class="col-span-2"><input type="text" placeholder="單位" class="item-u w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 ring-blue-500"></div>
                <div class="col-span-4"><input type="text" placeholder="單獨備註" class="item-note w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 ring-blue-500"></div>
                <div class="col-span-1 text-right"><button onclick="this.parentElement.parentElement.remove()" class="text-slate-300 hover:text-red-500"><i data-lucide="minus-circle" class="w-4 h-4"></i></button></div>
            `;
            container.appendChild(row);
            lucide.createIcons();
        }

        function openModal() {
            document.getElementById('input-id').value = 'REQ-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('input-vendor').value = '';
            document.getElementById('items-container').innerHTML = '';
            addItemRow();
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function saveData() {
            const vendor = document.getElementById('input-vendor').value;
            const rows = document.querySelectorAll('#items-container > div');
            const items = Array.from(rows).map(row => ({
                n: row.querySelector('.item-n').value,
                q: row.querySelector('.item-q').value,
                u: row.querySelector('.item-u').value,
                note: row.querySelector('.item-note').value
            })).filter(i => i.n && i.q);

            if(!vendor || items.length === 0) return alert('請填寫廠商與至少一項內容');

            masterData.unshift({ 
                id: document.getElementById('input-id').value, 
                type: document.getElementById('input-type').value, 
                status: '待處理', 
                vendor: vendor, 
                items: items, 
                time: Date.now() 
            });
            
            closeModal();
            renderTable(currentUser);
            showToast('單據發布成功');
        }

        function checkNotifications() {
            let count = 0;
            if(currentUser === 'procure') count = masterData.filter(d => d.status === '待通知載回').length;
            if(currentUser === 'factory') count = masterData.filter(d => d.status === '待處理' || d.status === '待載回').length;
            if(currentUser === 'warehouse') count = masterData.filter(d => d.status === '待入庫').length;
            if(count > 0) {
                document.getElementById('notify-msg').innerText = `您目前有 ${count} 筆單據待處理`;
                document.getElementById('notify-box').classList.remove('hidden');
                setTimeout(hideNotify, 6000);
            }
        }
        function hideNotify() { document.getElementById('notify-box').classList.add('hidden'); }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl font-bold text-sm z-[500] animate-in fade-in zoom-in duration-200';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.className += ' opacity-0 transition-opacity duration-500';
                setTimeout(() => t.remove(), 500);
            }, 2500);
        }

        window.onload = function() { lucide.createIcons(); };
    </script>
</body>
</html>
